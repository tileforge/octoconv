services:
  postgres:
    image: postgres:18
    container_name: octoconv-db
    restart: always
    environment:
      POSTGRES_USER: octo
      POSTGRES_PASSWORD: octo-pass
      POSTGRES_DB: octo_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octo -d octo_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: octoconv-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official MinIO images are no longer served from Docker Hub (pull access
  # denied, 2026-09), so MinIO runs from cgr.dev/chainguard/minio. That one
  # image carries minio, mc and sh, which is why createbucket below runs from it
  # too. It runs as uid/gid 65532, not root. Chainguard's free tier publishes
  # only :latest, so the pin is the digest of the multi-arch image index
  # (linux/amd64 + linux/arm64). The same string is minio.image and minio.mcImage
  # in deploy/chart/octoconv/values.yaml; internal/e2e/minio_image_pin_test.go
  # keeps them equal.
  # To bump: `docker buildx imagetools inspect cgr.dev/chainguard/minio:latest`,
  # take the top Digest (MediaType must be an image index listing both
  # platforms), replace it in both image: lines here and in minio.image and
  # minio.mcImage in values.yaml, then run `scripts/ci-local.sh helm gate e2e`.
  minio:
    image: cgr.dev/chainguard/minio@sha256:fa23f6a6f62645654530ff94aa077d1cc0d0e44c8f1cce02ab039873612edc72
    container_name: octoconv-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: create the bucket on startup. mc comes from the MinIO image
  # above; there is no separate mc image.
  createbucket:
    image: cgr.dev/chainguard/minio@sha256:fa23f6a6f62645654530ff94aa077d1cc0d0e44c8f1cce02ab039873612edc72
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/octoconv;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: octoconv-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      API_ADDR: ":8090"
      # HEALTH_ADDR (Phase 58, D-06/D-08): dedicated listener for GET
      # /healthz, mirroring the Helm chart's health containerPort. The same
      # endpoint continues to answer on API_ADDR too (D-08) for anything
      # that already probes it there.
      HEALTH_ADDR: ":8091"
      # DB_MAX_CONNS (Phase 58, D-06a): explicit main-pool sizing --
      # arithmetic recorded in internal/db/db.go's Connect doc comment
      # (10 = 4 concurrent inspect + 6 headroom for ordinary /v1/jobs
      # traffic sharing the same pool). Before this phase MaxConns was
      # never set at all.
      DB_MAX_CONNS: "10"
      MAX_UPLOAD_BYTES: "2147483648"
      TMPDIR: "/var/tmp/octoconv"
      MAX_IMAGE_PIXELS: "100000000"
      MAX_DOCUMENT_UNCOMPRESSED_BYTES: "524288000"
      API_KEY_SALT: "dev-only-change-me-in-real-deploys"
      # OPER-01/D-01: comma-separated operator client UUIDs authorized for
      # /v1/system/presets; empty = no operators, fail-closed (mirrors
      # deploy/chart/octoconv/values.yaml's api.operatorClientIds comment).
      # Parsed once at API startup -- changing this value requires an api
      # container restart/recreate to take effect (D-05).
      OPERATOR_CLIENT_IDS: "${OPERATOR_CLIENT_IDS:-}"
      RATE_LIMIT_IP_RPM: "60"
      RATE_LIMIT_CLIENT_RPM: "120"
      # Synchronous inspect boundaries (58-CONTEXT.md D-06, Plan 58-06):
      # STARTING values for the live gate (Plan 58-08, SC6) to calibrate,
      # not measured numbers. See .env.example for the full rationale,
      # including the distinction between the two byte ceilings (upload
      # vs. work) and the D-07 replicas:1 caveat on the rate budget below.
      INSPECT_MAX_UPLOAD_BYTES: "191889408"
      INSPECT_MAX_WORK_BYTES: "8388608"
      INSPECT_MAX_WORK_DURATION: "2s"
      INSPECT_MAX_CONCURRENT: "4"
      RATE_LIMIT_INSPECT_RPM: "30"
      # Protocol attempt budget for an image job (cmd/api). Default 120s.
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      # IN-02: queue.NewClient() derives audioUniqueTTL from these unconditionally
      # in EVERY process -- must be identical across all 7 queue.NewClient()-
      # constructing services (RTF-measured, 32-03-SUMMARY.md).
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      # IN-02 (Phase 36): same requirement, av engine -- AVUniqueTTL is
      # derived from these unconditionally in every queue.NewClient()-
      # constructing process; must be byte-identical across all 8 services
      # (36-03-SUMMARY.md).
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      # IN-02 (Phase 45): same requirement, ocr engine -- ocrUniqueTTL is
      # derived from these unconditionally in every queue.NewClient()-
      # constructing process; must be byte-identical across all 9 services
      # (45-02-SUMMARY.md). OCR_ENGINE_TIMEOUT measured (45-03-SUMMARY.md):
      # worst cell dense_eng p95=5.81 s/page, ceil(64 x 5.81 x 2.0)=744s,
      # 17.3% under the 900s reconciler CAP -- NOT copied from AV/AUDIO
      # (PITFALLS.md Pitfall 7).
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s" # measured, 45-03
      # IN-02 (Phase 49): same requirement, pandoc engine -- pandocUniqueTTL
      # is derived from these unconditionally in EVERY process; must be
      # byte-identical across all 10 queue.NewClient()-constructing services
      # (49-02-SUMMARY.md). MEASURED (49-03-SUMMARY.md,
      # scripts/pandoc-timing-measure.sh, arch=arm64, cpus=2.0, memory=1g,
      # N=10): worst cell html_large->md (reader-heavy HTML parsing)
      # p95=32.318s; PANDOC_ENGINE_TIMEOUT=ceil(32.318 x 2.0)=65s, 92.8%
      # under the 900s reconciler CAP.
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s).
      # PROBE_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      # TECTONIC_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03
      # PR#2 finding-1: unlike PANDOC_MAX_RETRY/PANDOC_ENGINE_TIMEOUT above
      # (which are IN-02 queue.NewClient() parity values), this one is read
      # by cmd/api as the pandoc per-engine UPLOAD ceiling, so the API
      # rejects 413 exactly what the worker's enforcePandocInputSize would
      # reject later instead of burning an S3 object and a queue slot on an
      # upload already known to be over-cap. Must stay byte-identical to the
      # pandoc-worker service's own PANDOC_MAX_INPUT_BYTES below or the two
      # tiers disagree.
      PANDOC_MAX_INPUT_BYTES: "3145728"
      STORAGE_TTL: "168h"
      METRICS_ADDR: "127.0.0.1:9090"
      # Worker protocol listener (D-02) stays off in base compose. All seven
      # WORKER_* variables stay unset here, so the client API starts without
      # worker PEMs. An explicit deployment override sets all seven together
      # and mounts the certificates. There is no TLS-off flag.
      # docker-compose.e2e.yml leaves this listener off.
      # WEBHOOK_ALLOW_PRIVATE_IPS / WEBHOOK_ALLOW_INSECURE_HTTP: deliberately
      # omitted here. Both default to false (safe) when unset, and this is
      # the production SSRF guard for callback_url -- it must stay
      # default-off in base compose. Only docker-compose.e2e.yml is
      # permitted to relax them, for the in-test webhook receiver (DEBT-05).
    ports:
      - "8090:8090"
      - "8091:8091"
    volumes:
      - api_spill:/var/tmp/octoconv
    # D-06b (Phase 58): api's FIRST resource limit ever, mirroring worker's
    # own deploy.resources.limits shape below verbatim (this compose file's
    # only limit syntax -- not `mem_limit`/`cpus` top-level keys). Compose is
    # NOT where the live gate calibrates this pair (the gate runs in k8s,
    # D-13) -- these are the same starting values as
    # deploy/chart/octoconv/values.yaml's api.resources.limits, present here
    # only so api is not the one container in this file with no ceiling at
    # all now that it parses untrusted bytes inline (POST /v1/inspect).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # Two symmetric webhook-worker replicas (not deploy.replicas, which
  # docker-compose ignores without swarm mode) -- this is the real ≥2-consumer
  # redundancy required by D-05/T-16-09/SC2: killing either one still leaves
  # the other draining the webhook queue. Both are identical, no
  # primary/secondary distinction.
  webhook-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.webhook-worker
    container_name: octoconv-webhook-worker-1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      WEBHOOK_WORKER_CONCURRENCY: "4"
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
      WEBHOOK_PRESIGN_TTL: "6h"
      RECONCILER_QUEUED_STALE_AFTER: "90s"
      # Restored to the Phase-31 code default (was a stale Phase-16 "5m"
      # override) -- MUST stay strictly above every AUDIO_ENGINE_TIMEOUT
      # below, or the reconciler recovers still-running audio jobs,
      # reopening the T-03-10 double-processing race (32-03-SUMMARY.md).
      RECONCILER_ACTIVE_STALE_AFTER: "15m"
      RECONCILER_SWEEP_INTERVAL: "1m"
      RECONCILER_MAX_RECOVERIES: "3"
      # Retention (RETN-01, D-11/D-12/D-13): batched purge on this same
      # reconciler tick. Go durations have no day unit -- 2160h=90d,
      # 9600h=400d (.env.example has the full rationale). Byte-identical
      # across .env.example/this file/the Helm ConfigMap and the Go
      # envDuration/envInt fallbacks in cmd/webhook-worker/main.go.
      JOBS_RETENTION: "2160h"
      USAGE_RETENTION: "9600h"
      RETENTION_BATCH_SIZE: "1000"
      # IN-02: queue.NewClient() derives every engine's unique-lock TTL from
      # these unconditionally in EVERY process -- they must be identical across
      # all eleven queue.NewClient()-constructing services (audio's own numbers
      # are RTF-measured, 32-03-SUMMARY.md).
      #
      # The image/document/html four below were MISSING here until Phase 64.
      # Phase 32 closed this gap for AUDIO_* and recorded the rest as
      # "pre-existing and out of scope"; that note stood for eight phases,
      # because nothing could see it. What made it invisible is that the
      # omission is currently HARMLESS BY COINCIDENCE: compose sets
      # ENGINE_TIMEOUT=120s / DOCUMENT_ENGINE_TIMEOUT=300s /
      # HTML_ENGINE_TIMEOUT=60s / DOCUMENT_MAX_RETRY=3 /
      # HTML_MAX_RETRY=3, which are byte-for-byte the Go defaults this process
      # fell back to. The first operator to tune any of them would have
      # split the fleet's lock TTLs in half, silently, and this service is the
      # one running the RECONCILER -- the component whose whole job is
      # re-enqueuing jobs the fleet already has.
      #
      # Found by queue.TestComposeReplicatesEveryEngineVarToEveryQueueClient-
      # Service, written for the ninth engine and immediately reporting the
      # first eight's gap.
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      DOCUMENT_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      HTML_MAX_RETRY: "3"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      # IN-02 (Phase 36): same requirement, av engine -- must be
      # byte-identical across all 8 services (36-03-SUMMARY.md).
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      # IN-02 (Phase 45): same requirement, ocr engine -- must be
      # byte-identical across all 9 services (45-02-SUMMARY.md).
      # OCR_ENGINE_TIMEOUT measured (45-03-SUMMARY.md): worst cell
      # dense_eng p95=5.81 s/page, ceil(64 x 5.81 x 2.0)=744s, 17.3%
      # under the 900s reconciler CAP.
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s" # measured, 45-03
      # IN-02 (Phase 49): same requirement, pandoc engine -- pandocUniqueTTL
      # is derived from these unconditionally in EVERY process; must be
      # byte-identical across all 10 queue.NewClient()-constructing services
      # (49-02-SUMMARY.md). MEASURED (49-03-SUMMARY.md,
      # scripts/pandoc-timing-measure.sh, arch=arm64, cpus=2.0, memory=1g,
      # N=10): worst cell html_large->md (reader-heavy HTML parsing)
      # p95=32.318s; PANDOC_ENGINE_TIMEOUT=ceil(32.318 x 2.0)=65s, 92.8%
      # under the 900s reconciler CAP.
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s).
      # PROBE_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      # TECTONIC_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03
      METRICS_ADDR: "127.0.0.1:9090"

  webhook-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.webhook-worker
    container_name: octoconv-webhook-worker-2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      WEBHOOK_WORKER_CONCURRENCY: "4"
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
      WEBHOOK_PRESIGN_TTL: "6h"
      RECONCILER_QUEUED_STALE_AFTER: "90s"
      # Restored to the Phase-31 code default (was a stale Phase-16 "5m"
      # override) -- MUST stay strictly above every AUDIO_ENGINE_TIMEOUT
      # below, or the reconciler recovers still-running audio jobs,
      # reopening the T-03-10 double-processing race (32-03-SUMMARY.md).
      RECONCILER_ACTIVE_STALE_AFTER: "15m"
      RECONCILER_SWEEP_INTERVAL: "1m"
      RECONCILER_MAX_RECOVERIES: "3"
      # Retention (RETN-01, D-11/D-12/D-13): batched purge on this same
      # reconciler tick. Go durations have no day unit -- 2160h=90d,
      # 9600h=400d (.env.example has the full rationale). Byte-identical
      # across .env.example/this file/the Helm ConfigMap and the Go
      # envDuration/envInt fallbacks in cmd/webhook-worker/main.go.
      JOBS_RETENTION: "2160h"
      USAGE_RETENTION: "9600h"
      RETENTION_BATCH_SIZE: "1000"
      # IN-02: queue.NewClient() derives every engine's unique-lock TTL from
      # these unconditionally in EVERY process -- they must be identical across
      # all eleven queue.NewClient()-constructing services (audio's own numbers
      # are RTF-measured, 32-03-SUMMARY.md).
      #
      # The image/document/html four below were MISSING here until Phase 64.
      # Phase 32 closed this gap for AUDIO_* and recorded the rest as
      # "pre-existing and out of scope"; that note stood for eight phases,
      # because nothing could see it. What made it invisible is that the
      # omission is currently HARMLESS BY COINCIDENCE: compose sets
      # ENGINE_TIMEOUT=120s / DOCUMENT_ENGINE_TIMEOUT=300s /
      # HTML_ENGINE_TIMEOUT=60s / DOCUMENT_MAX_RETRY=3 /
      # HTML_MAX_RETRY=3, which are byte-for-byte the Go defaults this process
      # fell back to. The first operator to tune any of them would have
      # split the fleet's lock TTLs in half, silently, and this service is the
      # one running the RECONCILER -- the component whose whole job is
      # re-enqueuing jobs the fleet already has.
      #
      # Found by queue.TestComposeReplicatesEveryEngineVarToEveryQueueClient-
      # Service, written for the ninth engine and immediately reporting the
      # first eight's gap.
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      DOCUMENT_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      HTML_MAX_RETRY: "3"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      # IN-02 (Phase 36): same requirement, av engine -- must be
      # byte-identical across all 8 services (36-03-SUMMARY.md).
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      # IN-02 (Phase 45): same requirement, ocr engine -- must be
      # byte-identical across all 9 services (45-02-SUMMARY.md).
      # OCR_ENGINE_TIMEOUT measured (45-03-SUMMARY.md): worst cell
      # dense_eng p95=5.81 s/page, ceil(64 x 5.81 x 2.0)=744s, 17.3%
      # under the 900s reconciler CAP.
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s" # measured, 45-03
      # IN-02 (Phase 49): same requirement, pandoc engine -- pandocUniqueTTL
      # is derived from these unconditionally in EVERY process; must be
      # byte-identical across all 10 queue.NewClient()-constructing services
      # (49-02-SUMMARY.md). MEASURED (49-03-SUMMARY.md,
      # scripts/pandoc-timing-measure.sh, arch=arm64, cpus=2.0, memory=1g,
      # N=10): worst cell html_large->md (reader-heavy HTML parsing)
      # p95=32.318s; PANDOC_ENGINE_TIMEOUT=ceil(32.318 x 2.0)=65s, 92.8%
      # under the 900s reconciler CAP.
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s).
      # PROBE_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      # TECTONIC_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
      # It is not an input to queue.NewClient.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03
      METRICS_ADDR: "127.0.0.1:9090"

  # Read-only asynq queue-inspection dashboard (OBS-03). Bound to 127.0.0.1
  # only, never 0.0.0.0 — no auth layer needed since it's unreachable outside
  # the host, matching the internal-only trust model (D-18/T-04-14). Image
  # pinned to a specific published tag (not :latest) per supply-chain hygiene
  # (T-04-15) — verified against Docker Hub's tag list at plan time.
  asynqmon:
    image: hibiken/asynqmon:0.7.2
    platform: linux/amd64
    container_name: octoconv-asynqmon
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8980:8080"

volumes:
  postgres_data:
    driver: local
