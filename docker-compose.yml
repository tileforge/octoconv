  # ffmpeg is source-built with a minimal --disable-everything codec set
  # (Dockerfile.av-worker, Phase 36 Plan 02) -- no platform: pin needed
  # (ffmpeg runtime CPU dispatch, 36-RESEARCH.md Pattern 3, mirrors the
  # audio-worker/chromium-worker precedent; no platform: pin on any worker
  # since phase 70).
  av-worker:
    build:
      context: .
      dockerfile: Dockerfile.av-worker
    container_name: octoconv-av-worker
    restart: always
    # cmd/av-worker sets asynq ShutdownTimeout = AV_ENGINE_TIMEOUT (753s,
    # below) + 10s = 763s so an in-flight ffmpeg transcode survives SIGTERM
    # instead of being aborted+requeued. Docker's default SIGKILL window is
    # 10s, which would make that graceful window dead configuration -- grant
    # 763s + 10s margin = 773s so the code's window is actually reachable
    # under compose (mirrors audio-worker's WR-05/762s precedent exactly:
    # AUDIO_ENGINE_TIMEOUT 742s + 20s = 762s). RTF-FINALIZED by Plan 04's
    # supervised scripts/av-rtf-measure.sh matrix run (D-05/AVE-04,
    # 36-04-SUMMARY.md): worst measured cell hevc@1080 p95_RTF=4.179133s
    # (N=10, this exact --cpus=2.0/--memory=1g container) -- NOT VP9 as
    # 36-RESEARCH.md's D-09 assumed; HEVC dominates VP9 by 1.86x.
    stop_grace_period: 773s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      # Same reasoning as IMAGE_SANDBOX_DISABLED on the worker service:
      # forwarded from .env, not set here -- unset means confined, and the
      # worker refuses to start if it cannot be.
      AV_SANDBOX_DISABLED: "${AV_SANDBOX_DISABLED:-}"
      # RTF-measured (Phase 36 Plan 04, threads=avThreadCount()=2 saturates
      # this service's own cpus=2.0 limit per job -- mirrors
      # AUDIO_WORKER_CONCURRENCY=1's exact provenance, audio-worker above:
      # concurrency > 1 would oversubscribe/CFS-thrash the 2 CPUs across
      # concurrent jobs, WR-06).
      AV_WORKER_CONCURRENCY: "1"
      # RTF-derived (Phase 36 Plan 04, D-05/AVE-04, 36-04-SUMMARY.md):
      # ceil(AV_MAX_DURATION_SECONDS x p95_RTF_worstcell x 2.0 safety) =
      # ceil(90 x 4.179133 x 2.0) = 753s (16.3% margin under the 900s/15m
      # reconciler CAP). Worst measured cell = hevc@1080 (NOT VP9 -- HEVC
      # dominates by 1.86x, contradicting 36-RESEARCH.md's D-09 assumption).
      # MUST be set identically in every queue.NewClient()-constructing
      # service (api + all workers) -- AVUniqueTTL is derived from it in each
      # enqueuing process (IN-02); a mismatch silently produces duplicate
      # processing. Coupled to RECONCILER_ACTIVE_STALE_AFTER (900s global
      # cap, webhook-worker-1/-2 below): raising this toward 900s requires
      # raising that threshold in the same change (32-03-SUMMARY.md
      # near-miss precedent).
      AV_ENGINE_TIMEOUT: "753s"
      AV_MAX_RETRY: "2" # D-03 LOCKED -- fewer attempts, longer backoff
      # Path B NO-GO lever fired (Phase 36 Plan 04, mirrors
      # AUDIO_MAX_DURATION_SECONDS's Phase 32 precedent, 32-03-SUMMARY.md):
      # lowered from the 14400s (4h) placeholder because the measured
      # worst-cell derivation at the 4h ceiling would have breached the
      # 900s/15m reconciler CAP. Path A (VP9 -cpu-used/-deadline tuning) was
      # rejected as ineffective -- it cannot touch the HEVC/mp4 path that
      # actually dominates (36-04-SUMMARY.md). Source-resolution bound
      # (36-RESEARCH.md Open Q3 / 36-REVIEW blocker, RESOLVED by Plan 04,
      # GENERALIZED by Plan 05's CR-01/HI-01 gap-closure): every re-encode
      # (no-scale passthrough AND an explicit resolution_height resize
      # alike) is fail-closed rejected in internal/convert/av.go
      # (enforceReencodeSourceBound) when the source exceeds 1920x1080 on
      # EITHER axis, NOT folded into this ceiling -- closing the
      # hevc@2160p OOM-KILL (exit 137) DoS vector found by this measurement
      # on EVERY re-encode path (not only the no-scale one). Stream-copy
      # remux is exempt. NAMED capability limitation: re-encoding/
      # downscaling FROM a source larger than 1080p is rejected, pending a
      # future measured decode-then-downscale RTF envelope.
      AV_MAX_DURATION_SECONDS: "90"
      # queue.NewClient() (constructed by cmd/av-worker/main.go) also reads
      # every OTHER engine class's retry/timeout vars unconditionally, even
      # though this process only runs the av engine (DEBT-05).
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      # IN-02 (Phase 45): same requirement, ocr engine -- must be
      # byte-identical across all 9 services (45-02-SUMMARY.md).
      # OCR_ENGINE_TIMEOUT measured (45-03-SUMMARY.md): worst cell
      # dense_eng p95=5.81 s/page, ceil(64 x 5.81 x 2.0)=744s, 17.3%
      # under the 900s reconciler CAP -- see ocr-worker service comment.
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s" # measured, 45-03 -- see ocr-worker service comment
      # IN-02 (Phase 49): same requirement, pandoc engine -- pandocUniqueTTL
      # is derived from these unconditionally in EVERY process; must be
      # byte-identical across all 10 queue.NewClient()-constructing services
      # (49-02-SUMMARY.md). MEASURED (49-03-SUMMARY.md,
      # scripts/pandoc-timing-measure.sh, arch=arm64, cpus=2.0, memory=1g,
      # N=10): worst cell html_large->md (reader-heavy HTML parsing)
      # p95=32.318s; PANDOC_ENGINE_TIMEOUT=ceil(32.318 x 2.0)=65s, 92.8%
      # under the 900s reconciler CAP -- see the pandoc-worker service
      # comment below for the full derivation.
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s). MUST be set
      # identically in every queue.NewClient()-constructing service (IN-02):
      # probeUniqueTTL is derived from it in each enqueuing process, and a
      # mismatch silently produces duplicate processing.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      PROBE_MAX_RETRY: "2"
      # IN-02 (Phase 64): same requirement, tex engine -- queue.NewClient()
      # derives tectonicUniqueTTL from these two unconditionally in EVERY
      # process, so they must be identical across all twelve
      # queue.NewClient()-constructing services. A mismatch does not error; it
      # produces two different lock TTLs for one job and the shorter one lets a
      # duplicate through. Enforced mechanically by
      # queue.TestComposeReplicatesEveryEngineVarToEveryQueueClientService,
      # which infers the service set rather than listing it.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      TECTONIC_MAX_RETRY: "2"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03 -- see pandoc-worker service comment
      METRICS_ADDR: "127.0.0.1:9090"
      # PUSH-02 (Phase 42): av-worker signs + fires opt-in inline progress
      # webhooks (internal/worker fireDetached). MUST match webhook-worker-1/-2's
      # WEBHOOK_SIGNING_SECRET exactly so a client verifies BOTH the throttled
      # progress events AND the terminal done/failed event with the same key.
      # Unset => cmd/av-worker fail-opens and progress webhooks are silently
      # disabled ("🔕 progress webhooks disabled"), so this line is what makes
      # progress_webhook=true actually deliverable in the compose deployment.
      # PROGRESS_WEBHOOK_TIMEOUT left at the code default (1500ms, < the 2s
      # PROGRESS_MIN_INTERVAL_SECONDS so at most one detached fire is in flight).
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
    deploy:
      resources:
        limits:
          # Fleet baseline (D-11); must match the RTF-measurement container
          # exactly, mirrors audio-worker's precedent.
          cpus: "2.0"
          # VALIDATED at 1g (Phase 36 Plan 04, D-05/AVE-04): every BOUNDED
          # (enum-legal, <=1080p) cell exited 0 cleanly at this limit across
          # N=10 runs; the only OOM (exit 137) was the hevc@2160p
          # passthrough cell -- now bounded on EVERY re-encode path, both
          # Height and Width (see AV_MAX_DURATION_SECONDS's source-resolution
          # bound comment above and internal/convert/av.go's
          # enforceReencodeSourceBound, 36-05 gap-closure/CR-01/HI-01).
          # Resolves Open Question 4 (audio's 1g vs chromium's 2g) with a
          # measured-not-assumed answer: 1g, matching audio-worker's own
          # baseline.
          memory: 1g

  # Tesseract/poppler are source-built (Dockerfile.ocr-worker, Phase 45
  # Plan 01) -- no platform: pin needed, same posture as av-worker/
  # audio-worker/chromium-worker (no platform: pin on any worker since
  # phase 70).
  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile.ocr-worker
    container_name: octoconv-ocr-worker
    restart: always
    # cmd/ocr-worker sets asynq ShutdownTimeout = OCR_ENGINE_TIMEOUT (744s,
    # below) + 10s = 754s so an in-flight tesseract/pdftoppm attempt
    # survives SIGTERM instead of being aborted+requeued (mirrors
    # av-worker's/audio-worker's own WR-05 margin). MEASURED
    # (45-03-SUMMARY.md, scripts/ocr-timing-measure.sh, arch=arm64,
    # cpus=2.0, memory=1g, N=10): worst cell dense_eng p95=5.81 s/page;
    # ceil(64 x 5.81 x 2.0)=744s + 10s ShutdownTimeout margin + 10s Docker
    # SIGKILL margin = 764s (mirrors av's 773s=753s+10s+10s derivation,
    # 36-04-SUMMARY.md). NOT copied from AV(753s)/AUDIO(742s)'s own
    # numbers -- 744s is distinct.
    stop_grace_period: 764s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      # Same reasoning as IMAGE_SANDBOX_DISABLED on the worker service:
      # forwarded from .env, not set here -- unset means confined, and the
      # worker refuses to start if it cannot be.
      OCR_SANDBOX_DISABLED: "${OCR_SANDBOX_DISABLED:-}"
      # D-03 (Phase 45, mirrors AV_WORKER_CONCURRENCY=1/
      # AUDIO_WORKER_CONCURRENCY=1's own measured-not-assumed provenance):
      # one OCR job at a time -- avoids CPU oversubscription/CFS-thrashing
      # on this cgroup-limited worker; a per-job OCR already streams pages
      # sequentially. A concurrency > 1 is a measured-evidence future
      # tweak, not v1 (ocr-worker-only, NOT read by queue.NewClient(), so
      # no IN-02 parity requirement).
      OCR_WORKER_CONCURRENCY: "1"
      # D-03 provisional ceiling of 200 BREACHED the 900s CAP at the
      # measured worst-cell p95 (ceil(200 x 5.81 x 2.0)=2324s) -- Path-B
      # NO-GO lever FIRED (45-03-SUMMARY.md, mirrors AV_MAX_DURATION_SECONDS's/
      # AUDIO_MAX_DURATION_SECONDS's own precedent): lowered 200 -> 64 so
      # ceil(64 x 5.81 x 2.0)=744s clears the 900s RECONCILER_ACTIVE_STALE_AFTER
      # CAP (webhook-worker-1/-2 below) with a 17.3% margin. ocr-worker-only,
      # NOT read by queue.NewClient().
      OCR_MAX_PAGES: "64"
      # Decompression-bomb ceiling for OCR's own image-source guard
      # (enforceImagePixelBound, ocrguards.go) -- same 100-megapixel
      # magnitude as the api service's MAX_IMAGE_PIXELS above, made an
      # operator-visible compose/.env.example knob rather than a silent
      # code default (mirrors MAX_IMAGE_PIXELS's own compose+.env.example
      # presence). ocr-worker-only, NOT read by queue.NewClient().
      OCR_MAX_IMAGE_PIXELS: "100000000"
      # MEASURED (D-02/OCRE-04, 45-03-SUMMARY.md): scripts/ocr-timing-measure.sh
      # run ALL GREEN on the real ocr-worker image at these exact
      # --cpus=2.0/--memory=1g compose limits (arch=arm64, N=10,
      # omp_thread_limit=2, representative synthesized corpus -- see
      # SUMMARY corpus note). Worst cell = dense_eng, p95=5.81 s/page.
      # OCR_ENGINE_TIMEOUT = ceil(OCR_MAX_PAGES x worst-cell-p95 x 2.0) =
      # ceil(64 x 5.81 x 2.0) = 744s, 17.3% under the 900s CAP. Path-B
      # lever fired first (OCR_MAX_PAGES 200 -> 64, see comment above).
      # NEVER copied from AV_ENGINE_TIMEOUT(753s)/AUDIO_ENGINE_TIMEOUT(742s)
      # (PITFALLS.md Pitfall 7 -- OCR's cost model is per-page, not
      # per-input-duration, so a neighbor's timeout is wrong-by-construction
      # here; 744 is distinct from both).
      OCR_ENGINE_TIMEOUT: "744s" # measured, 45-03-SUMMARY.md -- see comment above
      OCR_MAX_RETRY: "2"
      # IN-02 (Phase 49): same requirement, pandoc engine -- pandocUniqueTTL
      # is derived from these unconditionally in EVERY process; must be
      # byte-identical across all 10 queue.NewClient()-constructing services
      # (49-02-SUMMARY.md). MEASURED (49-03-SUMMARY.md,
      # scripts/pandoc-timing-measure.sh, arch=arm64, cpus=2.0, memory=1g,
      # N=10): worst cell html_large->md (reader-heavy HTML parsing)
      # p95=32.318s; PANDOC_ENGINE_TIMEOUT=ceil(32.318 x 2.0)=65s, 92.8%
      # under the 900s reconciler CAP -- see the pandoc-worker service
      # comment below for the full derivation.
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s). MUST be set
      # identically in every queue.NewClient()-constructing service (IN-02):
      # probeUniqueTTL is derived from it in each enqueuing process, and a
      # mismatch silently produces duplicate processing.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      PROBE_MAX_RETRY: "2"
      # IN-02 (Phase 64): same requirement, tex engine -- queue.NewClient()
      # derives tectonicUniqueTTL from these two unconditionally in EVERY
      # process, so they must be identical across all twelve
      # queue.NewClient()-constructing services. A mismatch does not error; it
      # produces two different lock TTLs for one job and the shorter one lets a
      # duplicate through. Enforced mechanically by
      # queue.TestComposeReplicatesEveryEngineVarToEveryQueueClientService,
      # which infers the service set rather than listing it.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      TECTONIC_MAX_RETRY: "2"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03 -- see pandoc-worker service comment
      # queue.NewClient() (constructed by cmd/ocr-worker/main.go) also reads
      # every OTHER engine class's retry/timeout vars unconditionally, even
      # though this process only runs the ocr engine (DEBT-05).
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      METRICS_ADDR: "127.0.0.1:9090"
      # PUSH-02-style (mirrors av-worker/PROG-03): cmd/ocr-worker signs +
      # fires opt-in inline progress webhooks (page-granular ramp for a
      # multi-page scanned PDF). MUST match webhook-worker-1/-2's own
      # WEBHOOK_SIGNING_SECRET exactly so a client verifies BOTH the
      # throttled progress events AND the terminal done/failed event with
      # the same key. Unset => cmd/ocr-worker fail-opens and progress
      # webhooks are silently disabled, so this line is what makes OCR
      # progress webhooks actually deliverable in the compose deployment.
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
    deploy:
      resources:
        limits:
          # Must match the scripts/ocr-timing-measure.sh measurement
          # container's --cpus/--memory EXACTLY (mirrors av-worker's own
          # fleet-baseline discipline) -- the measured p95 sec/page this
          # phase produces is only valid at these limits.
          cpus: "2.0"
          memory: 1g

  # pandoc is a pinned static-release binary (Dockerfile.pandoc-worker,
  # Phase 49 Plan 01) -- no platform: pin needed, same posture as
  # av-worker/audio-worker/chromium-worker/ocr-worker (no platform: pin on
  # any worker since phase 70). NO TeX toolchain --
  # markup<->markup only (->pdf deferred to v2).
  pandoc-worker:
    build:
      context: .
      dockerfile: Dockerfile.pandoc-worker
    container_name: octoconv-pandoc-worker
    restart: always
    # cmd/pandoc-worker sets asynq ShutdownTimeout = PANDOC_ENGINE_TIMEOUT
    # (65s, MEASURED below) + 10s = 75s so an in-flight pandoc attempt
    # survives SIGTERM instead of being aborted+requeued (mirrors
    # ocr-worker's/av-worker's/audio-worker's own WR-05 margin). stop_
    # grace_period = 75s + 10s Docker SIGKILL margin = 85s -- MEASURED
    # (49-03-SUMMARY.md, mirrors ocr-worker's 744s+20s=764s derivation,
    # 45-02-SUMMARY.md).
    stop_grace_period: 85s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      # 1, NOT 2: pandoc is CPU-fast but MEMORY-heavy. Measured in this exact
      # image at --cpus 2 --memory 1g (50-REVIEW BLOCKER-1 probe, 2026-08-02),
      # worst-case 3.04 MB dense-markup html->md: peak ANONYMOUS (unreclaimable)
      # memory 909 MiB/1024 at concurrency 1, and 1022 MiB/1024 at concurrency 2
      # -- i.e. ~300 MiB anon per MiB of input, and 2 parallel conversions leave
      # 1 MiB of headroom BEFORE the Go worker's own RSS, which shares this
      # cgroup. Concurrency 2 therefore OOMKills in production (the same failure
      # 50-04's live gate hit at 4.09 MB). Memory, not CPU, is the binding
      # constraint -- same reason OCR/AV/audio run 1-at-a-time. Throughput comes
      # from KEDA scale-out, not in-pod parallelism.
      # pandoc-worker-only, NOT read by queue.NewClient(), so no IN-02 parity.
      PANDOC_WORKER_CONCURRENCY: "1"
      # Input-size DoS guard (enforcePandocInputSize, markupsniff.go) AND
      # this phase's Path-B lever, WHICH FIRED (49-03-SUMMARY.md): the
      # supervised scripts/pandoc-timing-measure.sh run found the zip-out
      # targets (docx/epub) OOM-KILL ("Killed", 0-byte output) on this
      # service's 1g memory limit at an 8 MiB input -- cliff measured at
      # 4 MiB=~10.2s clean -> 6.5 MiB=~40s thrash -> 8 MiB=OOM. Fired BY
      # MEMORY, not by the 900s CAP (the CAP was never breached -- see
      # PANDOC_ENGINE_TIMEOUT below). Lowered from the 50 MiB (50<<20)
      # placeholder to 4 MiB (49-03), then to 3 MiB (50-04 Path-B, live
      # SC4 evidence): a ~4.09 MB html->md conversion OOMKilled the real
      # worker container (exit 137) at the 1Gi limit -- the Go worker +
      # pandoc share the cgroup, which the pandoc-alone calibration could
      # not see. (The concurrency half of that exposure was closed separately:
      # PANDOC_WORKER_CONCURRENCY 2 -> 1, see above -- at the 3 MiB cap a
      # single conversion already peaks at 909 MiB anon of 1024.)
      # The worst-cell 32.318s p95 below was measured at the
      # older 4 MiB cap (still a valid upper bound for 3 MiB inputs).
      # PR#2 finding-1: now ALSO read by the api service (as the upload
      # ceiling, see that service's PANDOC_MAX_INPUT_BYTES comment above) --
      # still NOT read by queue.NewClient(), so still no IN-02 parity
      # requirement in the uniqueTTL sense, but the two values must
      # nonetheless match byte-for-byte or the API accepts uploads the
      # worker will certainly reject.
      PANDOC_MAX_INPUT_BYTES: "3145728"
      # Same reasoning as IMAGE_SANDBOX_DISABLED on the worker service:
      # forwarded from .env, not set here -- unset means confined, and the
      # worker refuses to start if it cannot be.
      PANDOC_SANDBOX_DISABLED: "${PANDOC_SANDBOX_DISABLED:-}"
      # MEASURED (49-03-SUMMARY.md, scripts/pandoc-timing-measure.sh run
      # ALL GREEN, arch=arm64, cpus=2.0, memory=1g, N=10/cell, nearest-rank
      # p95, wall-sec/conversion, at the 4 MiB PANDOC_MAX_INPUT_BYTES cap
      # above). Worst cell = html_large->md (reader-heavy HTML parsing),
      # p95=32.318s (other large cells: md->html 25.37s, md->docx 23.34s,
      # html->docx 15.99s, latex->html 6.06s, latex->docx 3.90s; all
      # small/medium cells < 0.4s). PANDOC_ENGINE_TIMEOUT =
      # ceil(worst_p95 x 2.0) = ceil(32.318 x 2.0) = 65s, 92.8% under the
      # 900s/15m reconciler CAP -- the CAP itself was never at risk here;
      # Path-B fired for the DISTINCT memory reason above, not to clear
      # this CAP. NO MAX_PAGES-style multiplier (unlike OCR) -- pandoc's
      # p95 already IS the full per-conversion cost. NEVER copied from
      # OCR(744s)/AV(753s)/AUDIO(742s) or the 90s placeholder (PITFALLS.md
      # Pitfall 7) -- 65s is distinct from all four. MUST be set
      # identically in every queue.NewClient()-constructing service
      # (IN-02, 10 services) -- pandocUniqueTTL is derived from it in each
      # enqueuing process; a mismatch silently produces duplicate
      # processing.
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03-SUMMARY.md -- see comment above
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s). MUST be set
      # identically in every queue.NewClient()-constructing service (IN-02):
      # probeUniqueTTL is derived from it in each enqueuing process, and a
      # mismatch silently produces duplicate processing.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      PROBE_MAX_RETRY: "2"
      # IN-02 (Phase 64): same requirement, tex engine -- queue.NewClient()
      # derives tectonicUniqueTTL from these two unconditionally in EVERY
      # process, so they must be identical across all twelve
      # queue.NewClient()-constructing services. A mismatch does not error; it
      # produces two different lock TTLs for one job and the shorter one lets a
      # duplicate through. Enforced mechanically by
      # queue.TestComposeReplicatesEveryEngineVarToEveryQueueClientService,
      # which infers the service set rather than listing it.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      TECTONIC_MAX_RETRY: "2"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      # queue.NewClient() (constructed by cmd/pandoc-worker/main.go) also
      # reads every OTHER engine class's retry/timeout vars unconditionally,
      # even though this process only runs the pandoc engine (DEBT-05).
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s"
      METRICS_ADDR: "127.0.0.1:9090"
      # PUSH-02-style (mirrors av-worker/ocr-worker): cmd/pandoc-worker
      # signs + fires opt-in inline progress webhooks (harmless dead weight
      # for pandoc specifically, since PandocConverter never implements
      # convert.ProgressConverter -- kept only for wiring consistency with
      # every other worker cmd). MUST match webhook-worker-1/-2's own
      # WEBHOOK_SIGNING_SECRET exactly so a client verifies BOTH the
      # throttled progress events AND the terminal done/failed event with
      # the same key. Unset => cmd/pandoc-worker fail-opens and progress
      # webhooks are silently disabled, so this line is what makes pandoc
      # progress webhooks actually deliverable in the compose deployment.
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
    deploy:
      resources:
        limits:
          # Fleet baseline (mirrors ocr-worker's own discipline) -- MUST
          # match the scripts/pandoc-timing-measure.sh measurement
          # container's --cpus/--memory EXACTLY (49-03-SUMMARY.md ran at
          # these exact limits). Do NOT lower memory below 1g without
          # re-measuring: the zip-out (docx/epub) OOM-KILL cliff found at
          # this limit (8 MiB input) is what drove PANDOC_MAX_INPUT_BYTES
          # down to 4 MiB above -- a smaller memory limit would need its
          # own re-measured input-size cap.
          cpus: "2.0"
          memory: 1g

  # probe is the eighth engine class and the only one that converts nothing:
  # it runs the sanitize operation. Static Go binary plus three apt packages
  # (Dockerfile.probe-worker) -- no platform: pin needed, same posture as
  # av/audio/chromium/ocr/pandoc.
  #
  # The image carries ghostscript, unzip and file, and all three are required
  # rather than optional: verification cannot be skipped, and an output that
  # cannot be verified is discarded rather than delivered (D-07). A missing
  # binary stops the service instead of quietly degrading it.
  probe-worker:
    build:
      context: .
      dockerfile: Dockerfile.probe-worker
    container_name: octoconv-probe-worker
    restart: always
    # cmd/probe-worker sets asynq ShutdownTimeout = PROBE_ENGINE_TIMEOUT
    # (600s, MEASURED) + 10s = 610s. stop_grace_period = 610s + 10s Docker
    # SIGKILL margin = 620s, re-derived in the same edit that landed the
    # measured value.
    stop_grace_period: 620s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      # 1, NOT 2: pandoc is CPU-fast but MEMORY-heavy. Measured in this exact
      # image at --cpus 2 --memory 1g (50-REVIEW BLOCKER-1 probe, 2026-08-02),
      # worst-case 3.04 MB dense-markup html->md: peak ANONYMOUS (unreclaimable)
      # memory 909 MiB/1024 at concurrency 1, and 1022 MiB/1024 at concurrency 2
      # -- i.e. ~300 MiB anon per MiB of input, and 2 parallel conversions leave
      # 1 MiB of headroom BEFORE the Go worker's own RSS, which shares this
      # cgroup. Concurrency 2 therefore OOMKills in production (the same failure
      # 50-04's live gate hit at 4.09 MB). Memory, not CPU, is the binding
      # constraint -- same reason OCR/AV/audio run 1-at-a-time. Throughput comes
      # from KEDA scale-out, not in-pod parallelism.
      # pandoc-worker-only, NOT read by queue.NewClient(), so no IN-02 parity.
      # Input-size DoS guard (enforcePandocInputSize, markupsniff.go) AND
      # this phase's Path-B lever, WHICH FIRED (49-03-SUMMARY.md): the
      # supervised scripts/pandoc-timing-measure.sh run found the zip-out
      # targets (docx/epub) OOM-KILL ("Killed", 0-byte output) on this
      # service's 1g memory limit at an 8 MiB input -- cliff measured at
      # 4 MiB=~10.2s clean -> 6.5 MiB=~40s thrash -> 8 MiB=OOM. Fired BY
      # MEMORY, not by the 900s CAP (the CAP was never breached -- see
      # PANDOC_ENGINE_TIMEOUT below). Lowered from the 50 MiB (50<<20)
      # placeholder to 4 MiB (49-03), then to 3 MiB (50-04 Path-B, live
      # SC4 evidence): a ~4.09 MB html->md conversion OOMKilled the real
      # worker container (exit 137) at the 1Gi limit -- the Go worker +
      # pandoc share the cgroup, which the pandoc-alone calibration could
      # not see. (The concurrency half of that exposure was closed separately:
      # PANDOC_WORKER_CONCURRENCY 2 -> 1, see above -- at the 3 MiB cap a
      # single conversion already peaks at 909 MiB anon of 1024.)
      # The worst-cell 32.318s p95 below was measured at the
      # older 4 MiB cap (still a valid upper bound for 3 MiB inputs).
      # PR#2 finding-1: now ALSO read by the api service (as the upload
      # ceiling, see that service's PANDOC_MAX_INPUT_BYTES comment above) --
      # still NOT read by queue.NewClient(), so still no IN-02 parity
      # requirement in the uniqueTTL sense, but the two values must
      # nonetheless match byte-for-byte or the API accepts uploads the
      # worker will certainly reject.
      # MEASURED (49-03-SUMMARY.md, scripts/pandoc-timing-measure.sh run
      # ALL GREEN, arch=arm64, cpus=2.0, memory=1g, N=10/cell, nearest-rank
      # p95, wall-sec/conversion, at the 4 MiB PANDOC_MAX_INPUT_BYTES cap
      # above). Worst cell = html_large->md (reader-heavy HTML parsing),
      # p95=32.318s (other large cells: md->html 25.37s, md->docx 23.34s,
      # html->docx 15.99s, latex->html 6.06s, latex->docx 3.90s; all
      # small/medium cells < 0.4s). PANDOC_ENGINE_TIMEOUT =
      # ceil(worst_p95 x 2.0) = ceil(32.318 x 2.0) = 65s, 92.8% under the
      # 900s/15m reconciler CAP -- the CAP itself was never at risk here;
      # Path-B fired for the DISTINCT memory reason above, not to clear
      # this CAP. NO MAX_PAGES-style multiplier (unlike OCR) -- pandoc's
      # p95 already IS the full per-conversion cost. NEVER copied from
      # OCR(744s)/AV(753s)/AUDIO(742s) or the 90s placeholder (PITFALLS.md
      # Pitfall 7) -- 65s is distinct from all four. MUST be set
      # identically in every queue.NewClient()-constructing service
      # (IN-02, 10 services) -- pandocUniqueTTL is derived from it in each
      # enqueuing process; a mismatch silently produces duplicate
      # processing.
      PANDOC_ENGINE_TIMEOUT: "65s" # measured, 49-03-SUMMARY.md -- see comment above
      PANDOC_MAX_RETRY: "2"
      # MEASURED 2026-09-02 (scripts/probe-timeout-measure.sh; output and
      # derivation at .planning/phases/60-sanitize-eighth-engine-class/
      # evidence/probe-timeout-20260902-measured.txt). Cost is per PAGE, not
      # per byte: 1.99-2.01 s/page across 20/100/240-page points, measured in
      # the container at --cpus 2.0 --memory 1g against gs 10.00.0.
      # PROBE_ENGINE_TIMEOUT = ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33%
      # under the 900s reconciler cap. NOT a p95 -- with cost set by page count
      # a wall-clock percentile measures the corpus, not the engine. NEVER
      # copied from OCR(744s)/AV(753s)/AUDIO(742s)/PANDOC(65s). MUST be set
      # identically in every queue.NewClient()-constructing service (IN-02):
      # probeUniqueTTL is derived from it in each enqueuing process, and a
      # mismatch silently produces duplicate processing.
      PROBE_ENGINE_TIMEOUT: "600s" # measured, see the derivation above
      # probe-worker-only, NOT read by queue.NewClient(), so no IN-02 parity.
      # 1, with the OCR/AV/audio/pandoc engines: a sanitize job runs two
      # ghostscript passes plus a pdfcpu parse, all holding the whole
      # document, inside a 1g cgroup. REASONED, not measured -- the same
      # status as the timeout above.
      PROBE_WORKER_CONCURRENCY: "1"
      # Same reasoning as IMAGE_SANDBOX_DISABLED on the worker service:
      # forwarded from .env, not set here -- unset means confined, and the
      # worker refuses to start if it cannot be.
      PROBE_SANDBOX_DISABLED: "${PROBE_SANDBOX_DISABLED:-}"
      PROBE_MAX_RETRY: "2"
      # IN-02 (Phase 64): same requirement, tex engine -- queue.NewClient()
      # derives tectonicUniqueTTL from these two unconditionally in EVERY
      # process, so they must be identical across all twelve
      # queue.NewClient()-constructing services. A mismatch does not error; it
      # produces two different lock TTLs for one job and the shorter one lets a
      # duplicate through. Enforced mechanically by
      # queue.TestComposeReplicatesEveryEngineVarToEveryQueueClientService,
      # which infers the service set rather than listing it.
      #
      # 271s is MEASURED (2026-09-04): ceil(25.76 s/pass x 7 passes x 1.5),
      # the per-pass cost taken at the 2 MiB input ceiling and 7 being the
      # engine's own rerun maximum. Full derivation in .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      TECTONIC_MAX_RETRY: "2"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      # PROBE_MAX_PAGES (Phase 63, PROBE-02): pdfinfo counts the pages here,
      # before the first ghostscript pass, and the rejection is TERMINAL -- the
      # deliberate opposite of the timeout above, which stays transient because
      # it depends on load rather than on the file. This is the ONLY service
      # that reads it; the api-side admission gate was removed (63-CONTEXT.md
      # D-04, reversed).
      PROBE_MAX_PAGES: "200"
      # queue.NewClient() (constructed by cmd/pandoc-worker/main.go) also
      # reads every OTHER engine class's retry/timeout vars unconditionally,
      # even though this process only runs the pandoc engine (DEBT-05).
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s"
      METRICS_ADDR: "127.0.0.1:9090"
      # PUSH-02-style (mirrors av-worker/ocr-worker): cmd/pandoc-worker
      # signs + fires opt-in inline progress webhooks (harmless dead weight
      # for pandoc specifically, since PandocConverter never implements
      # convert.ProgressConverter -- kept only for wiring consistency with
      # every other worker cmd). MUST match webhook-worker-1/-2's own
      # WEBHOOK_SIGNING_SECRET exactly so a client verifies BOTH the
      # throttled progress events AND the terminal done/failed event with
      # the same key. Unset => cmd/pandoc-worker fail-opens and progress
      # webhooks are silently disabled, so this line is what makes pandoc
      # progress webhooks actually deliverable in the compose deployment.
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
    deploy:
      resources:
        limits:
          # NOT a capacity estimate. These are the cgroup limits phase 58's
          # D-02a conditioned pdfcpu's admission on -- this worker parses
          # untrusted bytes in three parsers, one of them (pdfcpu) inside its
          # own address space. Lowering or removing them reopens that
          # decision rather than tuning a knob.
          cpus: "2.0"
          memory: 1g

  # tectonic is the ninth engine class: real typesetting, latex -> pdf. Static
  # Go binary plus the tectonic CLI and a REDUCED TeX bundle baked into the
  # image (Dockerfile.tectonic-worker, ~128 MB, built by
  # scripts/tectonic-bundle-build.sh and digest-verified at build time).
  #
  # The bundle is not a size optimisation, it is TEX-02: without `-b <bundle>`
  # tectonic's DEFAULT behaviour is to fetch what the DOCUMENT asks for over
  # the network, at compile time, from relay.fullyjustified.net. That was
  # executed and captured, not assumed (64-02 evidence). The worker refuses to
  # start if the bundle is missing rather than falling back.
  #
  # No platform: pin needed, same posture as av/audio/chromium/ocr/pandoc/probe.
  tectonic-worker:
    build:
      context: .
      dockerfile: Dockerfile.tectonic-worker
    container_name: octoconv-tectonic-worker
    restart: always
    # cmd/tectonic-worker sets asynq ShutdownTimeout = TECTONIC_ENGINE_TIMEOUT
    # (271s, MEASURED) + 10s = 281s, so an in-flight compile survives SIGTERM
    # instead of being aborted and requeued. stop_grace_period = 281s + 10s
    # Docker SIGKILL margin = 291s. RE-DERIVED in the same edit that landed the
    # measured timeout -- probe's equivalent went a full phase describing 180s
    # after its value had become 600s, which is how a derived number goes stale.
    stop_grace_period: 291s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      # 1, with the heavy engines. A TeX interpreter plus a 128 MB bundle and
      # its compiled format are resident for the life of a job, inside this
      # service's 1g limit. Reasoned from memory, not measured -- throughput
      # comes from KEDA scale-out (deploy/chart, keda.tectonic), not from
      # raising this. tectonic-worker-only, NOT read by queue.NewClient(), so
      # no IN-02 parity requirement.
      TECTONIC_WORKER_CONCURRENCY: "1"
      # TECTONIC_MAX_OUTPUT_BYTES bounds the PRODUCED PDF. The 2 MiB input
      # ceiling does not: TeX ships pages out and frees the memory as it goes,
      # so 199 bytes of source measured 19 545 890 bytes of PDF in 93 seconds
      # through the live API -- 10x the largest LEGITIMATE output measured
      # (2 MiB source, 745 pages, 1 914 057 bytes), in a third of the time
      # available. 32 MiB is 17x a real document and still bounds the abuse.
      # tectonic-worker-only, like PROBE_MAX_PAGES: NOT read by
      # queue.NewClient(), so no IN-02 parity requirement.
      TECTONIC_MAX_OUTPUT_BYTES: "33554432"
      # IN-02 (Phase 64): queue.NewClient() derives tectonicUniqueTTL from
      # these two unconditionally in EVERY process -- identical across all
      # twelve queue.NewClient()-constructing services. 271s is MEASURED
      # (2026-09-04), and it is inseparable from the 2 MiB input ceiling it was
      # measured at: see .env.example.
      TECTONIC_ENGINE_TIMEOUT: "271s" # measured, see .env.example
      TECTONIC_MAX_RETRY: "2"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      # What one document may COST, as opposed to how long it may occupy
      # the clock. Interpolated from .env so the documented
      # `cp .env.example .env && docker compose up` path can actually
      # change it: an advertised setting the deployment ignores is the
      # same "configured but not plumbed" defect this variable exists to
      # fix (codex, PR #22).
      TECTONIC_ENGINE_CPU_SECONDS: "${TECTONIC_ENGINE_CPU_SECONDS:-271s}"
      # Same reasoning as IMAGE_SANDBOX_DISABLED on the worker service: the
      # tectonic worker has refused to start without Landlock since PR #21 and
      # names this switch, and until now it could only be applied by editing
      # this file.
      TECTONIC_SANDBOX_DISABLED: "${TECTONIC_SANDBOX_DISABLED:-}"
      # queue.NewClient() (constructed by cmd/tectonic-worker/main.go) also
      # reads every OTHER engine class's retry/timeout vars unconditionally,
      # even though this process only runs the tex engine (DEBT-05).
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s"
      PANDOC_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s"
      PROBE_ENGINE_TIMEOUT: "600s"
      PROBE_MAX_RETRY: "2"
      METRICS_ADDR: "127.0.0.1:9090"
      # Wiring consistency with every other worker cmd. Inert for this engine
      # in particular: TectonicConverter cannot implement
      # convert.ProgressConverter, because tectonic reruns until its references
      # converge and does not know in advance how many passes a document needs
      # -- there is no denominator to report progress against. MUST match
      # webhook-worker-1/-2's WEBHOOK_SIGNING_SECRET so a client verifies the
      # terminal done/failed event with the same key.
      WEBHOOK_SIGNING_SECRET: "dev-only-change-me-in-real-deploys"
    deploy:
      resources:
        limits:
          # The strongest reason any worker here has for a hard cgroup: this
          # one runs a TeX interpreter over a document that is a PROGRAM. The
          # image also runs as USER nobody for the same reason. 64-05's
          # measurement must run at exactly these limits to mean anything.
          cpus: "2.0"
          memory: 1g

  cad-worker:
    build:
      context: .
      dockerfile: Dockerfile.cad-worker
    container_name: octoconv-cad-worker
    restart: always
    stop_grace_period: 906s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://octo:octo-pass@postgres:5432/octo_db
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: octoconv
      S3_USE_SSL: "false"
      CAD_WORKER_CONCURRENCY: "1"
      CAD_ENGINE_TIMEOUT: "886s"
      CAD_MAX_RETRY: "2"
      CAD_GUARD_TIMEOUT: "21s"
      CAD_MESH_TIMEOUT: "324s"
      CAD_RENDER_TIMEOUT: "521s"
      CAD_DXF_TIMEOUT: "186s"
      CAD_RSVG_TIMEOUT: "217s"
      CAD_SANDBOX_DISABLED: "${CAD_SANDBOX_DISABLED:-}"
      IMAGE_MAX_RETRY: "4"
      ENGINE_TIMEOUT: "120s"
      DOCUMENT_MAX_RETRY: "3"
      DOCUMENT_ENGINE_TIMEOUT: "300s"
      HTML_MAX_RETRY: "3"
      HTML_ENGINE_TIMEOUT: "60s"
      AUDIO_MAX_RETRY: "3"
      AUDIO_ENGINE_TIMEOUT: "742s"
      AV_MAX_RETRY: "2"
      AV_ENGINE_TIMEOUT: "753s"
      OCR_MAX_RETRY: "2"
      OCR_ENGINE_TIMEOUT: "744s"
      PANDOC_MAX_RETRY: "2"
      PANDOC_ENGINE_TIMEOUT: "65s"
      PROBE_ENGINE_TIMEOUT: "600s"
      PROBE_MAX_RETRY: "2"
      TECTONIC_ENGINE_TIMEOUT: "271s"
      TECTONIC_MAX_RETRY: "2"
      METRICS_ADDR: "127.0.0.1:9090"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  # Read-only asynq queue-inspection dashboard (OBS-03). Bound to 127.0.0.1
  # only, never 0.0.0.0 — no auth layer needed since it's unreachable outside
  # the host, matching the internal-only trust model (D-18/T-04-14). Image
  # pinned to a specific published tag (not :latest) per supply-chain hygiene
  # (T-04-15) — verified against Docker Hub's tag list at plan time.
  asynqmon:
    image: hibiken/asynqmon:0.7.2
    platform: linux/amd64
    container_name: octoconv-asynqmon
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:8980:8080"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
