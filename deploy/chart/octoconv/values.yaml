# Default values for octoconv.
#
# This is the COMPLETE per-service value contract for the whole phase
# (interface-first). Plans 02/03 ADD templates that consume these keys —
# they do NOT edit this file. Real dev-credential values live in
# values-local.yaml, never here.

global:
  imageTag: "dev"
  namespace: "octoconv"

image:
  registry: ""
  pullPolicy: "IfNotPresent"

metrics:
  # 0.0.0.0 (not 127.0.0.1 like compose) — each binary runs in its own pod,
  # so there is no shared loopback to bind to. D-04.
  addr: "0.0.0.0:9090"

s3:
  # FQDN, not the compose bare "minio:9000" — presigned URLs must resolve
  # from pods AND from the OrbStack host. D-06.
  endpoint: "minio.octoconv.svc.cluster.local:9000"
  bucket: "octoconv"
  useSSL: "false"

# Per-service app blocks. Consumed by plan 02's Deployments; defined now so
# plan 02 never needs to touch this file.
api:
  image:
    repository: "octoconv-api"
  replicas: 1
  # OPER-01/D-01: comma-separated operator client UUIDs authorized for
  # /v1/system/presets; empty = no operators, fail-closed. Parsed once at
  # API startup -- changing this value requires an API restart.
  operatorClientIds: ""
  # QUOT-04/D-13: global quota kill-switch; only "true" disables enforcement
  # service-wide (Phase 52 Plan 04).
  quotaEnforcementDisabled: "false"
  # D-06b (Phase 58): api's FIRST resources.limits ever -- mirrors worker's
  # own cpu/memory shape above verbatim. These are STARTING values, not
  # measured ones: this phase introduces the api process's first untrusted-
  # byte parsing (POST /v1/inspect), and the live gate (58-08) is what
  # actually calibrates this pair against a pathological-burst run, the
  # same way audioWorker/avWorker/ocrWorker's limits below were calibrated
  # by their own RTF-measurement scripts, not assigned upfront. api ALSO
  # carries the self-migration on startup (db.Migrate, cmd/api/main.go) that
  # no worker carries -- do not lower memory below this starting point
  # without re-running the live gate; a migration failing mid-startup under
  # memory pressure is a worse failure mode than a worker OOM.
  spill:
    mountPath: "/var/tmp/octoconv"
    sizeLimit: "3837788160"
  resources:
    requests:
      ephemeralStorage: "3972005888"
    limits:
      cpu: "2"
      memory: "1Gi"
      ephemeralStorage: "3972005888"

probeWorker:
  image:
    repository: "octoconv-probe-worker"
  replicas: 1
  # 620s = PROBE_ENGINE_TIMEOUT (600s, ConfigMap, MEASURED) + 10s asynq
  # ShutdownTimeout margin + 10s Docker/k8s SIGKILL margin, following pandoc's
  # own-compose-precedent shape rather than the ENGINE_TIMEOUT+30s convention.
  # Re-derived in the same edit that landed the measured timeout.
  #
  # The chain the 600s comes from now closes at both ends: PROBE_MAX_PAGES=200
  # (ConfigMap, Phase 63) is the SAME 200 in ceil(2.0 s/page x 200 pages x 1.5)
  # = 600s, so the ceiling and the timeout describe one document bound rather
  # than two. Raising either without the other breaks that: a higher ceiling
  # admits work the timeout will kill, a lower one refuses work the timeout was
  # sized for. Both live in the ConfigMap template, not here -- no engine bound
  # in this chart is a values.yaml knob (PROBE_ENGINE_TIMEOUT is not either),
  # because these are derived numbers with their derivations
  # written beside them, not per-install preferences.
  # 620s = 600s + 10s asynq ShutdownTimeout margin + 10s Docker/k8s SIGKILL
  # margin, matching docker-compose.yml's probe-worker. It was 610s -- exactly
  # the ShutdownTimeout, with no margin at all. Same slip as tectonicWorker's,
  # found when the fix for that one was written as a rule over every worker
  # rather than as an edit to the one the review named.
  terminationGracePeriodSeconds: 620
  resources:
    limits:
      # 2 CPU / 1Gi: the cgroup limits phase 58 (D-02a) named as a condition
      # for allowing pdfcpu to parse untrusted bytes in-process at all. They
      # are not a capacity estimate -- they are the isolation the decision was
      # conditioned on, and lowering or removing them reopens that decision.
      cpu: "2"
      memory: "1Gi"

tectonicWorker:
  image:
    repository: "octoconv-tectonic-worker"
  replicas: 1
  # 291s = TECTONIC_ENGINE_TIMEOUT (271s, ConfigMap, MEASURED) + 10s asynq
  # ShutdownTimeout margin + 10s Docker/k8s SIGKILL margin, following pandoc's
  # and probe's own-derivation shape rather than the ENGINE_TIMEOUT+30s
  # convention.
  #
  # RE-DERIVED in the same edit that landed the measured timeout, deliberately:
  # probe's equivalent comment described 180s for a full phase after the chart
  # had moved to 600s. The failure mode of a derived number is not that it was
  # wrong when written -- it is that the derivation is not re-run when its input
  # changes.
  #
  # The chain closes at both ends, as probe's does: 271s comes from a run at the
  # 2 MiB input ceiling (api.defaultMaxEngineBytes), so the ceiling and the
  # timeout describe ONE document bound rather than two. Raising either without
  # the other breaks it -- a higher ceiling admits work the timeout will kill, a
  # lower one refuses work the timeout was sized for.
  # 291s = 271s + 10s asynq ShutdownTimeout margin + 10s Docker/k8s SIGKILL
  # margin -- the same derivation pandocWorker states and the same number
  # docker-compose.yml's tectonic-worker uses. It was 281s, which is EXACTLY the
  # ShutdownTimeout: Kubernetes would send SIGKILL at the instant asynq is still
  # allowed to be finishing a job, leaving nothing for signal delivery, the
  # final MarkDone or the metrics server, and abandoning the job to the
  # reconciler. Found in review (PR #16, codex round 2); probeWorker had the
  # same slip and is fixed in the same edit.
  terminationGracePeriodSeconds: 291
  resources:
    limits:
      # 2 CPU / 1Gi, the heavy-engine cgroup. Not symmetry: this worker runs a
      # TeX interpreter over a document that is a PROGRAM, with a 128 MB bundle
      # and a compiled format resident for the life of a job. The same reason
      # the image runs as nobody.
      cpu: "2"
      memory: "1Gi"

webhookWorker:
  image:
    repository: "octoconv-webhook-worker"
  replicas: 2
  terminationGracePeriodSeconds: 60

asynqmon:
  enabled: false
  image:
    repository: "hibiken/asynqmon"
    tag: "0.7.2"

# mcp-http (Phase 25, MCPH-01): streamable-HTTP MCP endpoint. Key-free env —
# only OCTOCONV_BASE_URL + MCP_HTTP_ADDR (D-06); the pod never reads an API
# key or DB/S3 secret. Default true so `helm install` brings it up alongside
# the rest of the app tier (D-05).
mcpHttp:
  enabled: true
  image:
    repository: "octoconv-mcp-http"
  replicas: 1
  addr: ":8070"
  # FQDN, same convention as s3.endpoint above — must resolve from the
  # mcp-http pod (D-06).
  baseURL: "http://api.octoconv.svc.cluster.local:8090"

# Stateful backbone — hand-rolled (D-02), same pinned images as compose.
postgres:
  image: "postgres:18"
  storage: "2Gi"
  db: "octo_db"
  user: "octo"

redis:
  # No PVC — asynq treats Redis as a transient broker; Postgres is the
  # system of record.
  image: "redis:8"

minio:
  # Official MinIO images are no longer served from Docker Hub. One
  # cgr.dev/chainguard image carries minio, mc and sh, so the MinIO Deployment
  # reads minio.image. Pinned by digest, never a floating tag
  # (D-02: OrbStack re-pulls :latest even from its shared local image store).
  # Same string as docker-compose.yml; the bump procedure is the comment above
  # the minio service there, and internal/e2e/minio_image_pin_test.go keeps the
  # two equal.
  image: "cgr.dev/chainguard/minio@sha256:fa23f6a6f62645654530ff94aa077d1cc0d0e44c8f1cce02ab039873612edc72"
  # Image of the containers that run mc (the createbucket Job and the
  # wait-for-bucket init container of every app Deployment). It defaults to the
  # same pinned image but is independent of minio.image, so overriding
  # minio.image with a server-only image (no sh, no mc) leaves those containers
  # working. Empty or missing falls back to minio.image. Any other value must be
  # pinned as repository@sha256:<64 hex>. A digest bump updates minio.image AND
  # minio.mcImage; minio_image_pin_test.go requires the two digests to match.
  mcImage: "cgr.dev/chainguard/minio@sha256:fa23f6a6f62645654530ff94aa077d1cc0d0e44c8f1cce02ab039873612edc72"
  # Who owns the MinIO data. uid and gid become runAsUser, runAsGroup and
  # fsGroup of the MinIO pod, and they are the owner the ownership init
  # container hands the volume to. 65532 is the user of the pinned image;
  # change both when minio.image runs MinIO as another uid/gid. Whole,
  # non-negative numbers only -- any other value aborts the render. A missing
  # or null key (for example after helm upgrade --reuse-values from a release
  # made before this block existed) gets the value shown here.
  # The init container only passes on elements owned by root (chown --from=0):
  # a volume that already belongs to another uid, for example 65532 after an
  # earlier migration, is NOT rewritten when you change the uid.
  dataOwnership:
    uid: 65532
    gid: 65532
    # true runs an init container on the MinIO pod that hands files owned by
    # root to uid:gid before the server starts, which is what lets MinIO
    # start on a volume written by the old root image. false renders no init
    # container at all, for a volume the old image never wrote or whose
    # ownership is managed outside the chart; a volume written by root then
    # stops MinIO at startup again. Only true or false; missing or null is true.
    migrate: true
    # Image of that init container; empty means minio.image. It runs as uid 0
    # with only the CHOWN capability, command in exec form without a shell, and
    # needs GNU chown with --from and -h. When set: repository@sha256:<64 hex>,
    # no tag.
    image: ""
  storage: "5Gi"
  rootUser: "minioadmin"
  rootPassword: "minioadmin"

# Consumed by plan 03's E2E overlay; declared now so values.yaml never
# needs another edit.
e2e:
  image: "octoconv-e2e"
  enabled: false

# Phase 27 (KEDA-02): minimal in-chart Prometheus (Deployment+ConfigMap+
# Service), scraping api's relocated octoconv_queue_depth metric so KEDA's
# Prometheus scaler has something to query. Default false (D-10) — base
# chart installs on a cluster without KEDA CRDs or Prometheus at all.
prometheus:
  enabled: false
  image: "prom/prometheus:v3.13.1"
  # Phase 50 (PDCP-02): production default UNCHANGED at 15s. This is
  # values-driven ONLY so values-loadproof.yaml can shorten the
  # metric-propagation lag for a gate whose job window is seconds-scale
  # (pandoc's SC4 downscale gate, PANDOC_ENGINE_TIMEOUT=65s) — see
  # templates/_helpers.tpl octoconv.prometheusScrapeConfig. That same
  # named-template's rendered content is what the Prometheus pod-template's
  # checksum/config annotation hashes (D-02/WR-05), so changing this value
  # correctly rolls the Prometheus pod.
  scrapeInterval: "15s"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# Phase 27 (KEDA-02): per-class ScaledObject trigger values. Gated on BOTH
# keda.enabled AND prometheus.enabled together (scaledobject-*.yaml) — a
# ScaledObject's trigger points at the in-chart Prometheus Service, so it
# must never render unless that Service also renders. Default false (D-10).
# webhook class deliberately has NO block here — it is hard-excluded from
# autoscaling (D-09), fixed at replicas: 2 in webhookWorker above.
# These are demo starting values; production tuning is Phase 28.
#
# INVARIANT (WR-06): each class's cooldownPeriod below must exceed that
# class's max per-task retry backoff step (internal/queue/queue.go —
# imageRetrySchedule tops out at 15s; documentRetrySchedule/htmlRetrySchedule
# top out at 30s; audioRetrySchedule also tops out at 30s; avRetrySchedule
# also tops out at 30s; ocrRetrySchedule tops out at 60s/1m;
# pandocRetrySchedule tops out at 20s), otherwise a ScaledObject can cool
# down to 0 replicas while a task is still legitimately mid-retry, stranding
# it until the reconciler recovers it.
# image=60s / document=120s / html=90s / audio=180s / av=180s / ocr=180s /
# pandoc=90s below all comfortably clear their respective schedules (pandoc's
# 90s comfortably clears its own 20s top step, verified against
# internal/queue/queue.go pandocRetrySchedule).
keda:
  enabled: false
  image:
    threshold: "5"
    maxReplicaCount: 4
    pollingInterval: 5
    cooldownPeriod: 60
    # minReplicaCount below is explicit as zero here and on all 7 classes
    # (SEED-011/CAPA-01, D-01) — the template renders this value directly
    # with NO conditional wrapper (unlike the downscale-stabilization
    # hasKey/ne-nil guard elsewhere in this file), so a bare key with no
    # comment would look like a missing feature rather than a deliberate
    # default. There is no per-class divergence in the VALUE (all seven are
    # zero), only in whether an operator chooses to override it; this
    # comment carries the rationale once, the remaining six classes below
    # just point back to it. Operators raise a class's floor via
    # values-capacity-floor.yaml or --set keda.<class>.minReplicaCount=N,
    # validated by octoconv.kedaMinReplicaCount (D-02) against that class's
    # own maxReplicaCount.
    minReplicaCount: 0
  document:
    threshold: "1"
    maxReplicaCount: 2
    pollingInterval: 15
    cooldownPeriod: 120
    scaleDownStabilizationSeconds: null   # NEW (D-10/Pattern 1) — production default OFF (K8s 300s HPA default preserved); load-proof gate overrides via values-loadproof.yaml
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  html:
    threshold: "2"
    maxReplicaCount: 2
    pollingInterval: 10
    cooldownPeriod: 90
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  audio:
    threshold: "1"
    maxReplicaCount: 2
    pollingInterval: 15
    cooldownPeriod: 180
    # NON-NULL (unlike document's null above): 742s worst-case exceeds the
    # k8s 300s HPA default, so this is load-bearing in production, not just
    # a load-proof-overlay knob. 900s = 742s + ~21% margin, aligned with the
    # 15m/900s reconciler cap -- a genuine downscale never races a live job.
    scaleDownStabilizationSeconds: 900
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  av:
    threshold: "1"
    maxReplicaCount: 2
    pollingInterval: 15
    cooldownPeriod: 180
    # NON-NULL (D-05): av's 753s worst-case job duration exceeds the k8s
    # 300s HPA default, so this knob is load-bearing in production, not
    # just a load-proof-overlay override -- same rationale as audio above.
    # 900s = 753s + ~19.5% margin, aligned with the 15m/900s reconciler cap
    # -- a genuine downscale never races a live job. Gated on BOTH hasKey
    # AND ne nil (falsy-0 guard, HARD-03/D-06) in scaledobject-av.yaml.
    scaleDownStabilizationSeconds: 900
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  ocr:
    threshold: "1"
    maxReplicaCount: 2
    pollingInterval: 15
    cooldownPeriod: 180
    # NON-NULL (D-01, mirrors audio/av 1:1): OCR_ENGINE_TIMEOUT=744s sits
    # between audio's 742s and av's 753s, so this knob is load-bearing in
    # production too, not just a load-proof-overlay override. 900s = 744s +
    # ~21% margin, aligned with the 15m/900s reconciler cap -- a genuine
    # downscale never races a live job. Gated on BOTH hasKey AND ne nil
    # (falsy-0 guard, HARD-03/D-06) in scaledobject-ocr.yaml.
    scaleDownStabilizationSeconds: 900
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  pandoc:
    # DERIVED FROM PANDOC'S OWN BUDGET (D-02), NOT copied from html even though
    # the numbers are identical. NOTE the derivation CHANGED on 2026-08-02:
    # threshold "2" was originally "= PANDOC_WORKER_CONCURRENCY", but the
    # BLOCKER-1 memory measurement forced concurrency down to 1, so that link is
    # gone and threshold is now re-derived on its own terms: 2 queued jobs of
    # backlog before paying a ~10s pod cold start, deliberate hysteresis for
    # seconds-scale work (measured p95=32.318s). It is ALSO load-bearing for the
    # SC4 gate: desired flips 2->1 at depth<=2, i.e. while BOTH pods are still
    # mid-conversion -- which is exactly the genuine mid-job downscale window
    # the 50-04 live proof captured. threshold "1" would flip at depth<=1, when
    # the victim pod is already idle. pollingInterval 10 / cooldownPeriod 90:
    # fast reaction, early return to 0.
    threshold: "2"
    maxReplicaCount: 2
    pollingInterval: 10
    cooldownPeriod: 90
    # NULL (D-01, mirrors document's FAST-engine profile above, NOT
    # audio/av/ocr's 900s): measured worst-case job is 65s
    # (PANDOC_ENGINE_TIMEOUT) -- the k8s 300s HPA default downscale
    # stabilization already covers this with >4x margin. A non-null knob
    # here would be cargo-culting the heavy engines whose ~742-753s jobs
    # genuinely exceed 300s. Gate-only override lives in
    # values-loadproof.yaml (D-04). Falsy-0 guard (HARD-03/D-06) still
    # applies in scaledobject-pandoc.yaml.
    scaleDownStabilizationSeconds: null
    minReplicaCount: 0   # explicit default (SEED-011/CAPA-01, D-01) — see keda.image above
  probe:
    # DERIVED FROM PROBE'S OWN BUDGET, not copied from pandoc even where the
    # numbers coincide. threshold "2": sanitize jobs are seconds-scale on the
    # measured corpus, so two queued jobs of backlog is the right hysteresis
    # before paying a pod cold start -- the same reasoning pandoc arrived at,
    # reached independently, and it would be wrong to record it as "same as
    # pandoc" because the day pandoc's changes this one must not follow.
    #
    # Revisited 2026-09-02 against the measured corpus (331 B - 2.2 MB, up to
    # 240 pages): threshold and cooldown hold, but the downscale
    # stabilization did not -- see scaleDownStabilizationSeconds below.
    threshold: "2"
    maxReplicaCount: 2
    pollingInterval: 10
    cooldownPeriod: 90
    # 900s, the HEAVY-engine profile -- and this changed when the timeout was
    # measured. The placeholder made probe look like a fast engine; the
    # measurement showed a 200-page scan costs 400s and the bound is 600s,
    # which is the same order as audio/av/ocr (742-753s) and well past the
    # k8s 300s HPA default downscale stabilization. A pod mid-sanitize would
    # otherwise be a candidate for removal 300s in, with 300s of work left.
    scaleDownStabilizationSeconds: 900
    minReplicaCount: 0
  tectonic:
    # DERIVED FROM THIS ENGINE'S OWN SHAPE, not copied from the class above it
    # even where the numbers coincide -- copying a neighbour's knob is the same
    # antipattern as copying its timeout (PITFALLS.md 7).
    #
    # threshold "2": a tex job is a seconds-scale compile on an ordinary
    # document, so two queued jobs is the right hysteresis before paying a pod
    # cold start -- and the cold start here is not free, since the pod's first
    # act is to stat a 128 MB bundle. Same number pandoc and probe reached, by
    # a different argument; recorded as its own argument so the day one of
    # theirs changes this one does not follow it.
    #
    # maxReplicaCount 2: matches the memory story, not the queue -- two
    # concurrent 1Gi TeX pods is what the current node budget carries.
    threshold: "2"
    maxReplicaCount: 2
    pollingInterval: 10
    cooldownPeriod: 90
    # null, the FAST-engine profile, and it HELD when the timeout was measured
    # (271s, 64-05) rather than being provisional on it. An ordinary document is
    # a 1-3 second job on the measured corpus and even 745 pages with a
    # bibliography is 180s, so a tex pod is not at risk of being removed
    # mid-compile inside the k8s 300s HPA default. Probe's equivalent went the
    # OTHER way on its own measurement (180s -> 600s, profile -> 900s), which is
    # why this is recorded as a checked outcome and not as agreement.
    scaleDownStabilizationSeconds: null
    minReplicaCount: 0
  cad:
    threshold: "1"
    maxReplicaCount: 2
    pollingInterval: 10
    cooldownPeriod: 90
    scaleDownStabilizationSeconds: 900
    minReplicaCount: 0
