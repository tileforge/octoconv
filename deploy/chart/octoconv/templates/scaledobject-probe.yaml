{{/*
KEDA ScaledObject — probe worker (sanitize pipeline).

Scales the `probe-worker` Deployment from 0 on the summed
octoconv_queue_depth for queue probe, counting pending + active + retry
states, via the Prometheus scaler (D-02 — retry-inclusive, never
scheduled/archived. Retry-state tasks are imminent work; excluding them left
a zeroed class blind to a retry backlog until the reconciler's next sweep).

The retry-inclusive part matters more here than for most classes: sanitize is
the one engine whose timeout classification is TRANSIENT (isProbeTerminal —
a ghostscript timeout depends on load, not on the file), so a load spike
produces retry-state tasks by design. A scaler blind to retry would read that
spike as an empty queue at exactly the moment it is not.

CO-DEPENDENCY GUARD: see scaledobject-image.yaml header — gated on BOTH
keda.enabled AND prometheus.enabled together.

QUEUE NAME LITERAL: the PromQL below carries its own `queue="probe"` literal,
as every other ScaledObject in this directory carries its own. That is what
makes adding an eighth class additive — no shared template, no list to edit,
and the seven existing files are byte-unchanged by this one's arrival.

SCALE-DOWN STABILIZATION: the FAST-engine profile (null), matching
document/pandoc rather than audio/av/ocr's 900s. Even the PLACEHOLDER
PROBE_ENGINE_TIMEOUT is 180s, inside the k8s 300s HPA default with margin;
the 900s knob exists for engines whose ~742-753s jobs genuinely exceed that
default, and copying it here would be cargo-culting a justification that does
not apply. Revisit if the operator's measured timeout lands above 300s.

FALSY-0 GUARD (HARD-03/D-06 fix #1): gated on BOTH `hasKey` AND `ne ... nil`,
not `hasKey` alone — a bare `hasKey` is true for the production default
`scaleDownStabilizationSeconds: null` and would render a broken
`stabilizationWindowSeconds: <no value>` block on every default install.
*/}}
{{- if and .Values.keda.enabled .Values.prometheus.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-probe-scaledobject
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: probe-worker
  minReplicaCount: {{ include "octoconv.kedaMinReplicaCount" (dict "class" "probe" "root" $) }}
  maxReplicaCount: {{ .Values.keda.probe.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.probe.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.probe.cooldownPeriod }}
  {{- if and (hasKey .Values.keda.probe "scaleDownStabilizationSeconds") (ne .Values.keda.probe.scaleDownStabilizationSeconds nil) }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.probe.scaleDownStabilizationSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
  {{- end }}
  fallback:
    failureThreshold: 3
    replicas: {{ include "octoconv.kedaFallbackReplicas" (dict "class" "probe" "root" $) }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.{{ .Values.global.namespace }}.svc.cluster.local:9090
        query: sum(octoconv_queue_depth{queue="probe", state=~"pending|active|retry"})
        threshold: {{ .Values.keda.probe.threshold | quote }}
        # Sustained absence of a PromQL result reads as a scaler ERROR, not
        # queue-empty (D-01) — fallback.replicas holds the class floor instead
        # of falsely scaling to zero with a live backlog behind an outage.
        ignoreNullValues: "false"
{{- end }}
