{{/*
MinIO — S3-compatible object storage. Deployment (single replica, single
RWO PVC, Recreate strategy — same rationale as postgres.yaml).

TIER-LABEL BOUNDARY: see templates/postgres.yaml — this pod template MUST
NOT carry octoconv.io/tier: app (reserved for plan 02's app Deployments).

Image is pinned by digest (D-02), never a floating tag — verify it is still
served: `docker buildx imagetools inspect {{ .Values.minio.image }}`.

Service metadata.name stays the literal "minio" (FQDN contract, D-06: the
ConfigMap's S3_ENDPOINT is minio.octoconv.svc.cluster.local:9000).
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "minio" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "minio" "root" $) | nindent 8 }}
    spec:
      {{- $ownership := include "octoconv.minioDataOwnership" $ | fromJson }}
      # The image runs as uid/gid 65532 (measured). The official image ran as
      # root, so the owner of the PVC never mattered before. fsGroup makes the
      # volume root group-writable for minio.dataOwnership.gid on volume types whose ownership
      # Kubernetes manages, and OnRootMismatch regroups a PVC written by the old
      # root image once. hostPath / local-path volumes do not apply fsGroup
      # (local-path creates its directories 0777). NOT verified on a live
      # cluster -- OrbStack Kubernetes was off; this is only rendered with
      # helm template.
      securityContext:
        runAsUser: {{ $ownership.uid }}
        runAsGroup: {{ $ownership.gid }}
        fsGroup: {{ $ownership.gid }}
        fsGroupChangePolicy: OnRootMismatch
      {{- if $ownership.migrate }}
      initContainers:
        - name: migrate-data-ownership
          image: {{ $ownership.image | default .Values.minio.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - chown
            - -R
            - -h
            - --from=0
            - {{ printf "%s:%s" $ownership.uid $ownership.gid | quote }}
            - /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: minio-data
              mountPath: /data
      {{- end }}
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          # mc is in this image, but httpGet on /minio/health/ready needs no exec
          # in the pod, so the probe stays HTTP rather than compose's
          # `mc ready local`.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: ClusterIP
  selector:
    {{- include "octoconv.selectorLabels" (dict "component" "minio" "root" $) | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
