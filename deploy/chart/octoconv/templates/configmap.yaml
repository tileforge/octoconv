{{/*
Non-secret env contract mirroring docker-compose exactly (S3_ENDPOINT is
the FQDN per D-06, METRICS_ADDR is 0.0.0.0 per D-04). Keyed for ALL
binaries — DEBT-05 requires every process to carry the full
retry/timeout surface even when it only enqueues, so every app Deployment
in plan 02 pulls this same ConfigMap via envFrom (octoconv.commonEnv).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: octoconv-config
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
data:
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_USE_SSL: {{ .Values.s3.useSSL | quote }}
  API_ADDR: ":8090"
  # HEALTH_ADDR (Phase 58, D-06/D-08): dedicated listener for GET /healthz,
  # matching deployment-api.yaml's health containerPort (8091) and
  # service-api.yaml's health Service port. See internal/api/routes.go's
  # HealthRoutes doc comment for what this port does and does not isolate.
  HEALTH_ADDR: ":8091"
  METRICS_ADDR: {{ .Values.metrics.addr | quote }}
  # DB_MAX_CONNS (Phase 58, D-06a): explicit main-pool sizing -- arithmetic
  # recorded in internal/db/db.go's Connect doc comment (10 = 4 concurrent
  # inspect + 6 headroom for ordinary /v1/jobs traffic sharing the same
  # pool). Before this phase MaxConns was never set at all.
  DB_MAX_CONNS: "10"
  MAX_UPLOAD_BYTES: "191889408"
  MAX_IMAGE_PIXELS: "100000000"
  MAX_DOCUMENT_UNCOMPRESSED_BYTES: "524288000"
  RATE_LIMIT_IP_RPM: "60"
  RATE_LIMIT_CLIENT_RPM: "120"
  # Synchronous inspect boundaries (58-CONTEXT.md D-06, Plan 58-06):
  # STARTING values for the live gate (Plan 58-08, SC6) to calibrate, not
  # measured numbers. Compose-parity byte-for-byte (docker-compose.yml api
  # service block) -- see .env.example for the full rationale, including
  # the distinction between the two byte ceilings (upload vs. work) and
  # the D-07 replicas:1 caveat on the rate budget below.
  INSPECT_MAX_UPLOAD_BYTES: "191889408"
  INSPECT_MAX_WORK_BYTES: "8388608"
  INSPECT_MAX_WORK_DURATION: "2s"
  INSPECT_MAX_CONCURRENT: "4"
  RATE_LIMIT_INSPECT_RPM: "30"
  # CONF-06/D-09 (phase 70): one task per container -- soffice's ruleset
  # grants the shared /tmp read-write; a confined worker refuses to start
  # above 1.
  DOCUMENT_WORKER_CONCURRENCY: "1"
  WEBHOOK_WORKER_CONCURRENCY: "4"
  ENGINE_TIMEOUT: "120s"
  DOCUMENT_ENGINE_TIMEOUT: "300s"
  DOCUMENT_MAX_RETRY: "3"
  HTML_ENGINE_TIMEOUT: "60s"
  AUDIO_ENGINE_TIMEOUT: "742s"
  AV_ENGINE_TIMEOUT: "753s"
  OCR_ENGINE_TIMEOUT: "744s"
  # Protocol attempt budget for a pandoc job (cmd/api). Default 65s.
  # PANDOC_MAX_INPUT_BYTES is the api upload ceiling.
  PANDOC_MAX_INPUT_BYTES: "3145728"
  PANDOC_ENGINE_TIMEOUT: "65s"
  # PROBE (sanitize). MEASURED 2026-09-02
  # (scripts/probe-timeout-measure.sh). ceil(2.0 s/page x 200 pages x 1.5) = 600s.
  # PROBE_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
  # It is not an input to queue.NewClient.
  PROBE_ENGINE_TIMEOUT: "600s"
  # TECTONIC (tex, latex -> pdf, Phase 64). MEASURED 2026-09-04
  # (scripts/tectonic-timeout-measure.sh; derivation in .env.example, full
  # output and corpus provenance committed under the phase's evidence/).
  #
  #   ceil(25.76 s/pass x 7 passes x 1.5) = 271s
  #
  # Unlike probe's, this cost is per PASS, not per page: the number of passes
  # is a property of the DOCUMENT, because tectonic reruns until its references
  # converge. The corpus therefore carries cross-references and a bibliography
  # (2, 3 and 7 passes for the same body text), and the ceiling in the formula
  # is the ENGINE's own -- it stops at 6 reruns and says so -- rather than
  # anything the corpus happened to contain.
  #
  # THE INPUT CEILING IS PART OF THIS NUMBER. Cost is linear in source size, so
  # the 2 MiB api.defaultMaxEngineBytes[EngineTectonic] is what makes 271s a
  # bound at all -- and the run it came from used a document 2.2% larger than
  # that ceiling, so the number covers slightly more work than is admissible: at 100 MiB a dense .tex would need ~9000s, ten times the 900s
  # RECONCILER_ACTIVE_STALE_AFTER cap. It is not a ConfigMap key (no engine
  # bound in this chart is), but changing it without re-measuring this value
  # breaks the pair.
  #
  # TECTONIC_ENGINE_TIMEOUT is the protocol attempt budget the API reads.
  # It is not an input to queue.NewClient.
  TECTONIC_ENGINE_TIMEOUT: "271s"
  CAD_ENGINE_TIMEOUT: "886s"
  CAD_MAX_RETRY: "2"
  CAD_WORKER_CONCURRENCY: "1"
  CAD_GUARD_TIMEOUT: "21s"
  CAD_MESH_TIMEOUT: "324s"
  CAD_RENDER_TIMEOUT: "521s"
  CAD_DXF_TIMEOUT: "186s"
  CAD_DWG_TIMEOUT: "186s"
  CAD_RSVG_TIMEOUT: "217s"
  VERAPDF_TIMEOUT: "60s"
  WEBHOOK_PRESIGN_TTL: "6h"
  RECONCILER_QUEUED_STALE_AFTER: "90s"
  # 15m (not the stale 5m) -- mirrors compose's already-shipped Phase-32
  # IN-16 fix. The audio engine timeout above (742s) must stay below this
  # value (15m/900s) so the reconciler never double-processes a genuinely
  # in-flight audio job as abandoned.
  RECONCILER_ACTIVE_STALE_AFTER: "15m"
  RECONCILER_SWEEP_INTERVAL: "1m"
  RECONCILER_MAX_RECOVERIES: "3"
  # Retention (RETN-01, Phase 51 Plan 04, D-11/D-12/D-13): batched purge on
  # this same reconciler tick, webhook-worker-only. Go durations have no day
  # unit -- 2160h=90d, 9600h=400d (.env.example has the full rationale).
  # Byte-identical across .env.example/docker-compose.yml/this file and the
  # Go envDuration/envInt fallbacks in cmd/webhook-worker/main.go.
  JOBS_RETENTION: "2160h"
  USAGE_RETENTION: "9600h"
  RETENTION_BATCH_SIZE: "1000"
  STORAGE_TTL: "168h"
  # ACCT-04, D-08: caps distinct client_id label values admitted onto
  # octoconv_client_job_outcomes_total. Unlike the RECONCILER_*/retention
  # keys above, this is NOT a per-process-must-match-exactly value (D-10:
  # the admitted-label map is per-process by design) -- the compiled Go
  # default (200) already applies everywhere this is left unset, so a
  # single shared ConfigMap entry is sufficient.
  METRICS_CLIENT_ID_CEILING: "200"
  OPERATOR_CLIENT_IDS: {{ .Values.api.operatorClientIds | default "" | quote }}
  # QUOT-04/D-13 (Phase 52 Plan 04): global quota kill-switch. Only the
  # literal "true" disables enforcement service-wide; empty does NOT.
  QUOTA_ENFORCEMENT_DISABLED: {{ .Values.api.quotaEnforcementDisabled | default "false" | quote }}
