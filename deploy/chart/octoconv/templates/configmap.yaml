{{/*
Non-secret env contract mirroring docker-compose exactly (S3_ENDPOINT is
the FQDN per D-06, METRICS_ADDR is 0.0.0.0 per D-04). Keyed for ALL
binaries — DEBT-05 requires every process to carry the full
retry/timeout surface even when it only enqueues, so every app Deployment
in plan 02 pulls this same ConfigMap via envFrom (octoconv.commonEnv).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: octoconv-config
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
data:
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_USE_SSL: {{ .Values.s3.useSSL | quote }}
  API_ADDR: ":8090"
  # HEALTH_ADDR (Phase 58, D-06/D-08): dedicated listener for GET /healthz,
  # matching deployment-api.yaml's health containerPort (8091) and
  # service-api.yaml's health Service port. See internal/api/routes.go's
  # HealthRoutes doc comment for what this port does and does not isolate.
  HEALTH_ADDR: ":8091"
  METRICS_ADDR: {{ .Values.metrics.addr | quote }}
  # DB_MAX_CONNS (Phase 58, D-06a): explicit main-pool sizing -- arithmetic
  # recorded in internal/db/db.go's Connect doc comment (10 = 4 concurrent
  # inspect + 6 headroom for ordinary /v1/jobs traffic sharing the same
  # pool). Before this phase MaxConns was never set at all.
  DB_MAX_CONNS: "10"
  MAX_UPLOAD_BYTES: "191889408"
  MAX_IMAGE_PIXELS: "100000000"
  MAX_DOCUMENT_UNCOMPRESSED_BYTES: "524288000"
  RATE_LIMIT_IP_RPM: "60"
  RATE_LIMIT_CLIENT_RPM: "120"
  # Synchronous inspect boundaries (58-CONTEXT.md D-06, Plan 58-06):
  # STARTING values for the live gate (Plan 58-08, SC6) to calibrate, not
  # measured numbers. Compose-parity byte-for-byte (docker-compose.yml api
  # service block) -- see .env.example for the full rationale, including
  # the distinction between the two byte ceilings (upload vs. work) and
  # the D-07 replicas:1 caveat on the rate budget below.
  INSPECT_MAX_UPLOAD_BYTES: "191889408"
  INSPECT_MAX_WORK_BYTES: "8388608"
  INSPECT_MAX_WORK_DURATION: "2s"
  INSPECT_MAX_CONCURRENT: "4"
  RATE_LIMIT_INSPECT_RPM: "30"
  WORKER_CONCURRENCY: "4"
  # CONF-06/D-09 (phase 70): one task per container -- soffice's ruleset
  # grants the shared /tmp read-write; a confined worker refuses to start
  # above 1.
  DOCUMENT_WORKER_CONCURRENCY: "1"
  WEBHOOK_WORKER_CONCURRENCY: "4"
  ENGINE_TIMEOUT: "120s"
  IMAGE_MAX_RETRY: "4"
  DOCUMENT_ENGINE_TIMEOUT: "300s"
  DOCUMENT_MAX_RETRY: "3"
  HTML_ENGINE_TIMEOUT: "60s"
  AUDIO_ENGINE_TIMEOUT: "742s"
  AV_ENGINE_TIMEOUT: "753s"
  # Compose-parity byte-for-byte (docker-compose.yml ocr-worker block,
  # Phase 45 measured: worst-cell dense_eng p95=5.81 s/page, ceil(64 x 5.81
  # x 2.0) = 744s, 17.3% under the 900s reconciler CAP). OCR_ENGINE_TIMEOUT/
  # OCR_MAX_RETRY are the IN-02 parity values every queue.NewClient()-
  # constructing service inherits identically via this shared ConfigMap --
  # a mismatch would silently produce duplicate processing. 744s stays
  # under the 15m/900s RECONCILER_ACTIVE_STALE_AFTER so the reconciler
  # never double-processes an in-flight OCR job as abandoned.
  OCR_WORKER_CONCURRENCY: "1"
  OCR_ENGINE_TIMEOUT: "744s"
  OCR_MAX_RETRY: "2"
  OCR_MAX_PAGES: "64"
  OCR_MAX_IMAGE_PIXELS: "100000000"
  # Compose-parity byte-for-byte (docker-compose.yml pandoc-worker block,
  # Phase 49 measured: worst cell html_large->md (reader-heavy HTML
  # parsing) p95=32.318s, ceil(32.318 x 2.0)=65s, 92.8% under the 900s
  # reconciler CAP). PANDOC_ENGINE_TIMEOUT/PANDOC_MAX_RETRY are the IN-02
  # parity values every queue.NewClient()-constructing service inherits
  # identically via this shared ConfigMap -- a mismatch would silently
  # produce duplicate processing (pandocUniqueTTL is derived from the
  # timeout in each enqueuing process). PANDOC_WORKER_CONCURRENCY is
  # pandoc-worker-only (not read by queue.NewClient()) but is baked into
  # this shared ConfigMap anyway, same posture as OCR_WORKER_CONCURRENCY/
  # OCR_MAX_PAGES above (DEBT-05 -- every process carries the full
  # retry/timeout surface even when unused). PANDOC_MAX_INPUT_BYTES is NOT
  # worker-only (PR#2 finding-1): cmd/api also reads it, as the pandoc
  # per-engine UPLOAD ceiling (Config.MaxPandocInputBytes) -- the key needs
  # no change here, the api Deployment already inherits the whole
  # ConfigMap via `include "octoconv.commonEnv"` -> `envFrom:
  # configMapRef: octoconv-config` (_helpers.tpl), verified not assumed.
  # Still NOT read by queue.NewClient(), so still no IN-02 uniqueTTL parity
  # requirement -- but the api and pandoc-worker readers must see the same
  # value or the API accepts uploads the worker will certainly reject.
  # PANDOC_MAX_INPUT_BYTES=3 MiB (Path-B, 49-03-SUMMARY.md 4 MiB -> 50-04
  # live SC4 evidence 3 MiB): the memory headroom lever at the 1Gi container
  # limit -- a ~4.09 MB html->md conversion OOMKilled the real worker
  # container (Go worker + pandoc share the cgroup). Do NOT lower memory below
  # 1Gi or raise this cap without re-measuring.
  # PANDOC_WORKER_CONCURRENCY=1 (50-REVIEW BLOCKER-1, measured 2026-08-02 at
  # cpus 2/memory 1g on a 3.04 MB dense html->md): peak ANON memory is
  # 909 MiB/1024 at concurrency 1 but 1022 MiB/1024 at concurrency 2 -- 2
  # parallel conversions OOMKill once the Go worker's own RSS is added. Memory
  # is the binding constraint; throughput comes from KEDA scale-out instead.
  PANDOC_WORKER_CONCURRENCY: "1"
  PANDOC_MAX_INPUT_BYTES: "3145728"
  PANDOC_ENGINE_TIMEOUT: "65s"
  PANDOC_MAX_RETRY: "2"
  # PROBE (sanitize, Phase 60). MEASURED 2026-09-02
  # (scripts/probe-timeout-measure.sh; derivation and full output at
  # .planning/phases/60-sanitize-eighth-engine-class/evidence/
  # probe-timeout-20260902-measured.txt). Cost is per PAGE, not per byte:
  # 1.99-2.01 s/page across three points, in the container at 2 CPU / 1 GiB
  # against gs 10.00.0. ceil(2.0 s/page x 200 pages x 1.5) = 600s, 33% under
  # the 900s reconciler cap. probeWorker.terminationGracePeriodSeconds (620s)
  # is derived from it. IN-02: read by every queue.NewClient()-constructing
  # service for probeUniqueTTL's derivation.
  PROBE_ENGINE_TIMEOUT: "600s"
  PROBE_MAX_RETRY: "2"
  # PROBE_MAX_PAGES (Phase 63, PROBE-01/PROBE-02) is the ceiling the timeout
  # above was already derived FROM -- the 200 in ceil(2.0 s/page x 200 pages
  # x 1.5). Until this phase the engine did not have it, so the timeout was
  # the only bound on the input and an over-long document failed LATE (ten
  # minutes of CPU), RETRIED (a probe timeout is TRANSIENT, correctly) and
  # OPAQUE (engine_error). Setting it to anything other than the number the
  # timeout assumes makes the two disagree about what this service sanitizes.
  #
  # PROVISIONAL, in the narrow sense the value's own doc comment states
  # (internal/convert/probebounds.go): 2.0 s/page is measured, but "200 pages
  # is a generous document bound" is reasoned from a hand-chosen corpus. The
  # hard ceiling nothing may exceed is the reconciler's: 900s at 2.0 s/page
  # is 450 pages.
  #
  # Read by cmd/probe-worker ONLY -- pdfinfo counts the pages before the first
  # ghostscript pass and the refusal is terminal. An admission gate in cmd/api
  # was built and removed (63-CONTEXT.md D-04, reversed): a page count cannot be
  # derived reliably from untrusted bytes in that process, because a page tree
  # is a tree and a long document declares several different counts. It sits in
  # the shared ConfigMap anyway, the same posture OCR_MAX_PAGES has (DEBT-05 --
  # every process carries the full surface even when unused).
  PROBE_MAX_PAGES: "200"
  # probe-worker-only, not read by queue.NewClient(). 1, with the heavier
  # engines: two ghostscript passes plus a pdfcpu parse all hold the whole
  # document inside a 1Gi cgroup. Reasoned, not measured.
  PROBE_WORKER_CONCURRENCY: "1"
  # TECTONIC (tex, latex -> pdf, Phase 64). MEASURED 2026-09-04
  # (scripts/tectonic-timeout-measure.sh; derivation in .env.example, full
  # output and corpus provenance committed under the phase's evidence/).
  #
  #   ceil(25.76 s/pass x 7 passes x 1.5) = 271s
  #
  # Unlike probe's, this cost is per PASS, not per page: the number of passes
  # is a property of the DOCUMENT, because tectonic reruns until its references
  # converge. The corpus therefore carries cross-references and a bibliography
  # (2, 3 and 7 passes for the same body text), and the ceiling in the formula
  # is the ENGINE's own -- it stops at 6 reruns and says so -- rather than
  # anything the corpus happened to contain.
  #
  # THE INPUT CEILING IS PART OF THIS NUMBER. Cost is linear in source size, so
  # the 2 MiB api.defaultMaxEngineBytes[EngineTectonic] is what makes 271s a
  # bound at all -- and the run it came from used a document 2.2% larger than
  # that ceiling, so the number covers slightly more work than is admissible: at 100 MiB a dense .tex would need ~9000s, ten times the 900s
  # RECONCILER_ACTIVE_STALE_AFTER cap. It is not a ConfigMap key (no engine
  # bound in this chart is), but changing it without re-measuring this value
  # breaks the pair.
  #
  # tectonicWorker.terminationGracePeriodSeconds (291s) is derived from this and
  # was re-derived in the same edit. IN-02: read by every
  # queue.NewClient()-constructing service for tectonicUniqueTTL's derivation --
  # a value that reaches one process and not another does not error, it silently
  # produces duplicate processing.
  TECTONIC_ENGINE_TIMEOUT: "271s"
  # Bounds the PRODUCED PDF, which the 2 MiB input ceiling does not: TeX ships
  # pages out as it goes, so 198 bytes of source measured 6 040 163 bytes of PDF
  # in 16 seconds against 1 914 057 for the largest legitimate document (2 MiB,
  # 745 pages). tectonic-worker-only; not an IN-02 var.
  # What one document may COST, as opposed to how long it may occupy the clock.
  # Measured at this chart's 2-CPU quota: idle the engine's cpu/wall ratio is
  # 1.00, and under 4x oversubscription the same document took 3.67s wall for
  # 1.08s of CPU. A wall-clock bound alone therefore refuses documents for the
  # sins of their neighbours; this one refuses them for what they consumed.
  # At least 1s: RLIMIT_CPU is whole seconds, so anything below truncates to a
  # budget of zero and applies no limit at all. The worker refuses to start
  # rather than run with a bound it has logged and does not enforce.
  TECTONIC_ENGINE_CPU_SECONDS: "271s"
  TECTONIC_MAX_OUTPUT_BYTES: "33554432"
  # TECTONIC_SANDBOX_DISABLED is deliberately ABSENT, not set to "false".
  # Absent means the engine is confined by Landlock and the worker refuses to
  # start if it cannot be -- so a node pool that loses Landlock produces a pod
  # that will not become ready, which is visible, rather than a pod that
  # typesets client documents with read access to every mounted secret, which
  # is not. Landlock needs no capability and no privileged securityContext.
  TECTONIC_MAX_RETRY: "2"
  # tectonic-worker-only, not read by queue.NewClient(). 1, with the heavy
  # engines: a TeX interpreter plus a 128 MB bundle and its compiled format
  # inside a 1Gi cgroup. Reasoned, not measured -- and the reasoning is memory,
  # so throughput comes from KEDA scale-out (keda.tectonic) rather than from
  # raising this.
  TECTONIC_WORKER_CONCURRENCY: "1"
  # TECTONIC_BUNDLE_PATH is deliberately ABSENT from this ConfigMap. It is
  # baked into the image (Dockerfile.tectonic-worker) beside the bundle it
  # names, and envFrom would override that image value for every pod -- with a
  # path only the tex image's filesystem has. cmd/tectonic-worker stats it and
  # exits fatally at startup, so the failure would be immediate and total
  # rather than subtle; that is not a reason to arrange for it. DEBT-05's
  # "every process carries the full surface" applies to knobs, not to paths
  # into one image's filesystem.
  CAD_ENGINE_TIMEOUT: "886s"
  CAD_MAX_RETRY: "2"
  CAD_WORKER_CONCURRENCY: "1"
  CAD_GUARD_TIMEOUT: "21s"
  CAD_MESH_TIMEOUT: "324s"
  CAD_RENDER_TIMEOUT: "521s"
  CAD_DXF_TIMEOUT: "186s"
  CAD_DWG_TIMEOUT: "186s"
  CAD_RSVG_TIMEOUT: "217s"
  VERAPDF_TIMEOUT: "60s"
  WEBHOOK_PRESIGN_TTL: "6h"
  RECONCILER_QUEUED_STALE_AFTER: "90s"
  # 15m (not the stale 5m) -- mirrors compose's already-shipped Phase-32
  # IN-16 fix. The audio engine timeout above (742s) must stay below this
  # value (15m/900s) so the reconciler never double-processes a genuinely
  # in-flight audio job as abandoned.
  RECONCILER_ACTIVE_STALE_AFTER: "15m"
  RECONCILER_SWEEP_INTERVAL: "1m"
  RECONCILER_MAX_RECOVERIES: "3"
  # Retention (RETN-01, Phase 51 Plan 04, D-11/D-12/D-13): batched purge on
  # this same reconciler tick, webhook-worker-only. Go durations have no day
  # unit -- 2160h=90d, 9600h=400d (.env.example has the full rationale).
  # Byte-identical across .env.example/docker-compose.yml/this file and the
  # Go envDuration/envInt fallbacks in cmd/webhook-worker/main.go.
  JOBS_RETENTION: "2160h"
  USAGE_RETENTION: "9600h"
  RETENTION_BATCH_SIZE: "1000"
  STORAGE_TTL: "168h"
  # ACCT-04, D-08: caps distinct client_id label values admitted onto
  # octoconv_client_job_outcomes_total. Unlike the RECONCILER_*/retention
  # keys above, this is NOT a per-process-must-match-exactly value (D-10:
  # the admitted-label map is per-process by design) -- the compiled Go
  # default (200) already applies everywhere this is left unset, so a
  # single shared ConfigMap entry is sufficient.
  METRICS_CLIENT_ID_CEILING: "200"
  OPERATOR_CLIENT_IDS: {{ .Values.api.operatorClientIds | default "" | quote }}
  # QUOT-04/D-13 (Phase 52 Plan 04): global quota kill-switch. Only the
  # literal "true" disables enforcement service-wide; empty does NOT.
  QUOTA_ENFORCEMENT_DISABLED: {{ .Values.api.quotaEnforcementDisabled | default "false" | quote }}
