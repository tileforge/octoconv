{{/*
KEDA ScaledObject — tectonic worker (tex engine class, latex -> pdf).

Scales the `tectonic-worker` Deployment from 0 on the summed
octoconv_queue_depth for queue tectonic, counting pending + active + retry
states, via the Prometheus scaler (D-02 — retry-inclusive, never
scheduled/archived. Retry-state tasks are imminent work; excluding them left
a zeroed class blind to a retry backlog until the reconciler's next sweep).

Retry-inclusive is kept, but NOT for probe's reason, and the difference is
worth stating because the original text here borrowed probe's argument and that
argument has since been retired. On this engine a timeout is TERMINAL
(isTectonicTerminal — the input is a program, so a document that does not finish
never will), so a load spike does NOT manufacture retry-state tex tasks the way
it does for sanitize.

What still produces them is infrastructure: a storage or database failure mid
job is transient for every engine, and those arrive in bursts precisely when the
cluster is under pressure. A scaler blind to retry would read such a burst as an
empty queue at the moment the backlog is real.

CO-DEPENDENCY GUARD: see scaledobject-image.yaml header — gated on BOTH
keda.enabled AND prometheus.enabled together.

QUEUE NAME LITERAL: the PromQL below carries its own `queue="tectonic"`
literal, as every other ScaledObject in this directory carries its own. That
is what makes adding a ninth class additive — no shared template, no list to
edit, and the eight existing files are byte-unchanged by this one's arrival.
That claim is not asserted here; it is diffed, before and after (SC5).

SCALE-DOWN STABILIZATION: null, the FAST-engine profile (document/pandoc/
html), NOT probe's or audio's 900s — and this survived the measurement rather
than preceding it. 64-05 measured TECTONIC_ENGINE_TIMEOUT at 271s, which sits
just inside the k8s 300s HPA default downscale stabilization, and the corpus
says why: an ordinary document (no bibliography) is a 1-3 second job, and even
745 pages with a bibliography is 180s. Probe's knob went the other way when
ITS placeholder was measured — 180s became 600s and the profile became 900s —
so this is the same test applied to a different engine, not the same answer
copied.

Revisit if the 2 MiB input ceiling is ever raised: the timeout is derived from
a run at that ceiling, and a bound above 300s would put a pod mid-compile in
the HPA's removal window.

FALSY-0 GUARD (HARD-03/D-06 fix #1): gated on BOTH `hasKey` AND `ne ... nil`,
not `hasKey` alone — a bare `hasKey` is true for the production default
`scaleDownStabilizationSeconds: null` and would render a broken
`stabilizationWindowSeconds: <no value>` block on every default install.
*/}}
{{- if and .Values.keda.enabled .Values.prometheus.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-tectonic-scaledobject
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: tectonic-worker
  minReplicaCount: {{ include "octoconv.kedaMinReplicaCount" (dict "class" "tectonic" "root" $) }}
  maxReplicaCount: {{ .Values.keda.tectonic.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.tectonic.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.tectonic.cooldownPeriod }}
  {{- if and (hasKey .Values.keda.tectonic "scaleDownStabilizationSeconds") (ne .Values.keda.tectonic.scaleDownStabilizationSeconds nil) }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.tectonic.scaleDownStabilizationSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
  {{- end }}
  fallback:
    failureThreshold: 3
    replicas: {{ include "octoconv.kedaFallbackReplicas" (dict "class" "tectonic" "root" $) }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.{{ .Values.global.namespace }}.svc.cluster.local:9090
        query: sum(octoconv_queue_depth{queue="tectonic", state=~"pending|active|retry"})
        threshold: {{ .Values.keda.tectonic.threshold | quote }}
        # Sustained absence of a PromQL result reads as a scaler ERROR, not
        # queue-empty (D-01) — fallback.replicas holds the class floor instead
        # of falsely scaling to zero with a live backlog behind an outage.
        ignoreNullValues: "false"
{{- end }}
