{{/*
probe-worker Deployment — probe engine class (the sanitize operation; the one
class that serves no conversion at all).

TIER LABEL: pod template carries octoconv.io/tier: app (see
deployment-worker.yaml header for the full rationale — identical here), so the
octoconv-app-metrics NetworkPolicy selects it automatically and no
networkpolicy edit is needed.

GRACE DERIVATION: 180s PROBE_ENGINE_TIMEOUT (ConfigMap) -> 190s asynq
ShutdownTimeout (cmd/probe-worker adds 10s) -> 190s
terminationGracePeriodSeconds. Follows pandoc's own-derivation shape rather
than the ENGINE_TIMEOUT+30s convention used by worker/document/audio/av/ocr.

PROVISIONAL: 180s is a PLACEHOLDER, not a measurement. Everything derived from
it here is provisional too, and must be re-derived in the same edit that lands
the operator-measured value (Phase 60 SC5).

RESOURCE LIMITS ARE LOAD-BEARING, not a capacity estimate: the 2 CPU / 1Gi
cgroup limits are the isolation phase 58's D-02a conditioned pdfcpu's
admission on. This worker parses untrusted bytes in three parsers, one of them
inside its own address space.

No cgroup/OMP env: ghostscript is a single subprocess per pass, not a
thread-count-tunable engine like tesseract/ffmpeg.

startupProbe: the same generous startup budget every other worker uses,
keeping this pod out of CrashLoopBackOff before the metrics listener is up.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-worker
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe-worker
spec:
  {{- if and .Values.keda.enabled .Values.prometheus.enabled }}
  # spec.replicas intentionally omitted when KEDA/HPA owns this Deployment
  # (WR-02, Phase 28 D-10): rendering a fixed value here would make every
  # `helm upgrade` reset a scaled-to-zero class back to this default,
  # fighting the HPA. Once KEDA/HPA has taken ownership it manages
  # spec.replicas directly via the scale subresource.
  {{- else }}
  replicas: {{ .Values.probeWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "probe-worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "probe-worker" "root" $) | nindent 8 }}
        octoconv.io/tier: app
    spec:
      {{- include "octoconv.waitForPostgres" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.probeWorker.terminationGracePeriodSeconds }}
      containers:
        - name: probe-worker
          image: "{{ .Values.probeWorker.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          {{- include "octoconv.commonEnv" . | nindent 10 }}
          {{- if .Values.probeWorker.extraEnv }}
          # extraEnv (Phase 28 D-08, mirrors documentWorker.extraEnv):
          # explicit `env:` entries take precedence over envFrom-sourced
          # values for the same key, which is how a load-proof overlay pins
          # PROBE_WORKER_CONCURRENCY or a candidate PROBE_ENGINE_TIMEOUT
          # without editing the ConfigMap. probeWorker.extraEnv is
          # intentionally absent from values.yaml so this block renders
          # nothing in production.
          env:
            {{- range $k, $v := .Values.probeWorker.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: {{ .Values.probeWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.probeWorker.resources.limits.memory | quote }}
