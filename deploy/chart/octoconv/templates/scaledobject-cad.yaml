{{- if and .Values.keda.enabled .Values.prometheus.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-cad-scaledobject
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: cad-worker
  minReplicaCount: {{ include "octoconv.kedaMinReplicaCount" (dict "class" "cad" "root" $) }}
  maxReplicaCount: {{ .Values.keda.cad.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.cad.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cad.cooldownPeriod }}
  {{- if and (hasKey .Values.keda.cad "scaleDownStabilizationSeconds") (ne .Values.keda.cad.scaleDownStabilizationSeconds nil) }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.cad.scaleDownStabilizationSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
  {{- end }}
  fallback:
    failureThreshold: 3
    replicas: {{ include "octoconv.kedaFallbackReplicas" (dict "class" "cad" "root" $) }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.{{ .Values.global.namespace }}.svc.cluster.local:9090
        query: sum(octoconv_queue_depth{queue="cad", state=~"pending|active|retry"})
        threshold: {{ .Values.keda.cad.threshold | quote }}
        ignoreNullValues: "false"
{{- end }}
