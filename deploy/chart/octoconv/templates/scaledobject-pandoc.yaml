{{/*
KEDA ScaledObject — pandoc worker (markup<->markup interconvert pipeline).
Scales the `pandoc-worker` Deployment from 0 on the summed
octoconv_queue_depth for queue pandoc, counting pending + active + retry
states, via the Prometheus scaler (D-02 — retry-inclusive, never
scheduled/archived. Retry-state tasks are imminent work; excluding them left
a zeroed class blind to a retry backlog until the reconciler's next sweep).

CO-DEPENDENCY GUARD: see scaledobject-image.yaml header — gated on BOTH
keda.enabled AND prometheus.enabled together.

SCALE-DOWN STABILIZATION (D-01, FAST-engine profile — mirrors document, NOT
audio/av/ocr's 900s): cooldownPeriod above governs ONLY the 1->0 transition.
The N->N-1 (N>1) step is governed by the standard Kubernetes HPA, whose
scaleDown.stabilizationWindowSeconds defaults to 300s. Pandoc's measured
worst-case job is only 65s (PANDOC_ENGINE_TIMEOUT) — the k8s 300s default
already covers this with >4x margin, so production
keda.pandoc.scaleDownStabilizationSeconds stays null here (unlike
audio/av/ocr's genuinely-load-bearing 900s, whose ~742-753s jobs exceed
300s). A non-null knob in production would be cargo-culting the heavy
engines. The gate-only override lives in values-loadproof.yaml, exactly like
document's own always-null-in-prod case.

FALSY-0 GUARD (HARD-03/D-06 fix #1): the block below is gated on BOTH
`hasKey` AND `ne ... nil`, not `hasKey` alone. A bare `hasKey` is TRUE for
the production default `scaleDownStabilizationSeconds: null` (values.yaml)
and would render a broken `stabilizationWindowSeconds: <no value>` block on
every default install — retained verbatim so values-loadproof.yaml can
override stabilization for the live gate, including with a literal 0 which
the guard must render rather than swallow.
*/}}
{{- if and .Values.keda.enabled .Values.prometheus.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-pandoc-scaledobject
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    name: pandoc-worker
  minReplicaCount: {{ include "octoconv.kedaMinReplicaCount" (dict "class" "pandoc" "root" $) }}
  maxReplicaCount: {{ .Values.keda.pandoc.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pandoc.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.pandoc.cooldownPeriod }}
  {{- if and (hasKey .Values.keda.pandoc "scaleDownStabilizationSeconds") (ne .Values.keda.pandoc.scaleDownStabilizationSeconds nil) }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.keda.pandoc.scaleDownStabilizationSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
  {{- end }}
  fallback:
    failureThreshold: 3
    replicas: {{ include "octoconv.kedaFallbackReplicas" (dict "class" "pandoc" "root" $) }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.{{ .Values.global.namespace }}.svc.cluster.local:9090
        query: sum(octoconv_queue_depth{queue="pandoc", state=~"pending|active|retry"})
        threshold: {{ .Values.keda.pandoc.threshold | quote }}
        # Sustained absence of a PromQL result (e.g. api unreachable or
        # unscrapeable) now reads as a scaler ERROR, not queue-empty (D-01)
        # — fallback.replicas holds max(1, keda.pandoc.minReplicaCount)
        # replicas for this class instead of falsely scaling to zero with a
        # live backlog behind an outage, so an operator-configured floor is
        # not silently undone by the very outage that makes cold-start
        # latency hurt most (SEED-011/D-05).
        ignoreNullValues: "false"
{{- end }}
