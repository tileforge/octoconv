{{/*
api Deployment — the only app component that self-migrates the schema on
startup (cmd/api/main.go calls db.Migrate unconditionally; D-05 refinement,
see 24-02 plan). Single replica keeps that migration race-free.

TIER LABEL: this pod template carries octoconv.io/tier: app (in addition to
the shared octoconv.labels + component=api) — it is the sole podSelector
discriminator for networkpolicy-metrics.yaml. The Deployment's own
selector.matchLabels MUST stay on component=api (NOT tier), so multiple
tier=app Deployments never collide on the same selector.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "api" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "api" "root" $) | nindent 8 }}
        octoconv.io/tier: app
    spec:
      {{- include "octoconv.waitForDeps" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "octoconv.commonEnv" . | nindent 10 }}
          {{- if .Values.api.extraEnv }}
          # extraEnv (plan 03): explicit `env:` entries always take
          # precedence over envFrom-sourced values for the same key
          # (k8s-documented behaviour) — this is how values-e2e.yaml's SSRF
          # relaxations override the ConfigMap's RATE_LIMIT_* defaults
          # without editing the ConfigMap itself.
          env:
            {{- range $k, $v := .Values.api.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
            - name: metrics
              containerPort: 9090
            # health (Phase 58, D-06/D-06a/D-08): a THIRD, dedicated port
            # for GET /healthz, distinct from http (8090). api is still the
            # only app component with a real health endpoint. The probes
            # below deliberately opt INTO this port rather than staying on
            # 8090: this phase for the first time parses untrusted bytes
            # inline in the api process (POST /v1/inspect, INSP-05/06), and
            # a pathological burst against 8090 must not be able to starve
            # the liveness probe's own accept path. This closes the
            # HTTP-accept half of that risk only -- the Postgres-pool half
            # (handleHealth's dependency ping sharing a pool with
            # Repo.PreAdmit) is closed separately by internal/db.ConnectHealth
            # (D-06a, Plan 58-03 Task 1); moving the port alone does NOT
            # close that half, and this comment says so explicitly so the
            # next reader does not repeat the mistake.
            - name: health
              containerPort: 8091
          # Readiness is tight so a transient dependency blip pulls the pod
          # from rotation quickly; liveness is tolerant so the same blip
          # doesn't trigger a restart storm on top of the rotation pull.
          # periodSeconds/failureThreshold below are UNCHANGED by Phase 58
          # (5/2 and 10/6) -- they are the contract the live gate (58-08)
          # calibrates its pathological-burst pass/fail threshold against
          # (six consecutive liveness failures = ~60s to a restart); only
          # WHICH PORT they poll changed.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8091
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
            periodSeconds: 10
            failureThreshold: 6
          # D-06b: api gets resources.limits for the first time in this
          # phase. Before Phase 58, api's profile was "small, I/O-bound,
          # cheap" and never carried a cgroup limit at all (every worker
          # Deployment does, see deployment-worker.yaml). This phase is the
          # first to parse untrusted bytes inline in the api process
          # (POST /v1/inspect) -- without a cgroup backstop, the in-process
          # byte/time work ceiling (Plan 58-06) would be the ONLY line of
          # defense, and a bug in it could grow the process until the NODE,
          # not just the pod, is under memory/CPU pressure. Values below are
          # STARTING points (see values.yaml api.resources.limits' own
          # comment) subject to calibration by the live gate (58-08), not a
          # measured ceiling yet.
          resources:
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}
