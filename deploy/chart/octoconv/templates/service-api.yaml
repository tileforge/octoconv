{{/*
Service metadata.name stays the literal "api" (not fullname-prefixed) so
in-cluster clients (including plan 03's E2E Job) can reach
http://api.octoconv.svc.cluster.local:8090 — same FQDN convention as
postgres/redis/minio (D-06). ClusterIP only: no ingress/LoadBalancer this
phase; OrbStack routes cluster.local from the host per research.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "octoconv.selectorLabels" (dict "component" "api" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    # Prometheus (prometheus.yaml, gated prometheus.enabled) scrapes this
    # port to feed KEDA's Prometheus scaler (Phase 27, D-11).
    - name: metrics
      port: 9090
      targetPort: 9090
    # health (Phase 58, D-06/D-08): NOT for kubelet's own readiness/liveness
    # probes -- those hit the pod's containerPort directly and never go
    # through a Service. This port exists so an IN-CLUSTER driver (the live
    # gate, 58-08/SC6) can poll GET /healthz through the same Service
    # address every other in-namespace caller uses, during a pathological
    # inspect burst, without needing to know which pod backs it.
    - name: health
      port: 8091
      targetPort: 8091
