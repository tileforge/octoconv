{{/*
chromium-worker Deployment — HTML-to-X engine class (headless Chromium).

TIER LABEL: pod template carries octoconv.io/tier: app (see
deployment-worker.yaml header for the full rationale — identical here).

Grace 90s (D-09) is ≥ HTML_ENGINE_TIMEOUT (60s, ConfigMap) + margin.

/dev/shm (G-69-3, closes D-10): nothing is mounted at /dev/shm for this
worker. The engine runs with --disable-dev-shm-usage
(internal/convert/chromium.go's chromiumPrintArgs), and the html Landlock
ruleset (internal/convert/htmlsandbox.go) grants no /dev/shm at all -- a
production-scale document (18 page sections, large incompressible images, a
5000-row table) was measured to convert clean through the confined
production path with no /dev/shm mount and no Landlock denial, and a
negative control confirmed the method would have caught a real /dev/shm
dependency had one existed. Measured, not merely re-asserted here --
docs/SANDBOX-PATHS.md, html section.

startupProbe: heavy Chromium image cold start gets the same generous
startup budget as document-worker (see that file's header).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromium-worker
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: chromium-worker
spec:
  {{- if and .Values.keda.enabled .Values.prometheus.enabled }}
  # spec.replicas intentionally omitted when KEDA/HPA owns this Deployment
  # (WR-02, Phase 28 D-10): rendering a fixed value here would make every
  # `helm upgrade` reset a scaled-to-zero class back to this default,
  # fighting the HPA. Once KEDA/HPA has taken ownership it manages
  # spec.replicas directly via the scale subresource.
  {{- else }}
  replicas: {{ .Values.chromiumWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "chromium-worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "chromium-worker" "root" $) | nindent 8 }}
        octoconv.io/tier: app
    spec:
      {{- include "octoconv.waitForDeps" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.chromiumWorker.terminationGracePeriodSeconds }}
      containers:
        - name: chromium-worker
          image: "{{ .Values.chromiumWorker.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          {{- include "octoconv.commonEnv" . | nindent 10 }}
          {{- if .Values.chromiumWorker.extraEnv }}
          # extraEnv (mirrors deployment-pandoc-worker.yaml's own block):
          # explicit `env:` entries always take precedence over
          # envFrom-sourced values for the same key -- this is how
          # HTML_SANDBOX_DISABLED=true is set (phase 69), the remedy the
          # worker names when it refuses to start; an HTML_WORKER_CONCURRENCY
          # above 1 set here is refused while confined (D-03).
          # chromiumWorker.extraEnv is intentionally absent from values.yaml
          # so this block renders nothing in production.
          env:
            {{- range $k, $v := .Values.chromiumWorker.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: {{ .Values.chromiumWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.chromiumWorker.resources.limits.memory | quote }}
