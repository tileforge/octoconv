apiVersion: apps/v1
kind: Deployment
metadata:
  name: cad-worker
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: cad-worker
spec:
  {{- if not (and .Values.keda.enabled .Values.prometheus.enabled) }}
  replicas: {{ .Values.cadWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "cad-worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "cad-worker" "root" $) | nindent 8 }}
        octoconv.io/tier: app
    spec:
      {{- include "octoconv.waitForDeps" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.cadWorker.terminationGracePeriodSeconds }}
      containers:
        - name: cad-worker
          image: "{{ .Values.cadWorker.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          {{- include "octoconv.commonEnv" . | nindent 10 }}
          {{- if .Values.cadWorker.extraEnv }}
          env:
            {{- range $k, $v := .Values.cadWorker.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: {{ .Values.cadWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.cadWorker.resources.limits.memory | quote }}
