{{/*
ocr-worker Deployment — OCR engine class (text-layer extraction pipeline).
Like audio-worker/av-worker, this image (Dockerfile.ocr-worker) is built
with no --platform pin at all — it runs natively on any node arch, no
emulation or fixed-arch framing needed.

TIER LABEL: pod template carries octoconv.io/tier: app (see
deployment-worker.yaml header for the full rationale — identical here).
This is what the octoconv-app-metrics NetworkPolicy selects on, so
ocr-worker is covered automatically — no networkpolicy edit needed.

Grace 774s (OCR_ENGINE_TIMEOUT 744s, ConfigMap + 30s margin) is >=
OCR_ENGINE_TIMEOUT — satisfies SC4 so a genuine N->N-1 downscale never
premature-SIGTERMs a live OCR job. Distinct from compose's
stop_grace_period=764=744+10+10, which is the compose convention.

OMP_THREAD_LIMIT is deliberately NOT set in this pod spec — cmd/ocr-worker
sets it itself from the cgroup CPU quota at process startup, mirroring
av-worker.

startupProbe: same generous startup budget as audio-worker/av-worker/
document-worker/chromium-worker, keeping this pod out of a
CrashLoopBackOff before the metrics listener is up, while readiness/
liveness stay tight once startup has succeeded.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  labels:
    {{- include "octoconv.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocr-worker
spec:
  {{- if and .Values.keda.enabled .Values.prometheus.enabled }}
  # spec.replicas intentionally omitted when KEDA/HPA owns this Deployment
  # (WR-02, Phase 28 D-10): rendering a fixed value here would make every
  # `helm upgrade` reset a scaled-to-zero class back to this default,
  # fighting the HPA. Once KEDA/HPA has taken ownership it manages
  # spec.replicas directly via the scale subresource.
  {{- else }}
  replicas: {{ .Values.ocrWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "octoconv.selectorLabels" (dict "component" "ocr-worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "octoconv.labels" . | nindent 8 }}
        {{- include "octoconv.selectorLabels" (dict "component" "ocr-worker" "root" $) | nindent 8 }}
        octoconv.io/tier: app
    spec:
      {{- include "octoconv.waitForDeps" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.ocrWorker.terminationGracePeriodSeconds }}
      containers:
        - name: ocr-worker
          image: "{{ .Values.ocrWorker.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          {{- include "octoconv.commonEnv" . | nindent 10 }}
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9090
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: {{ .Values.ocrWorker.resources.limits.cpu | quote }}
              memory: {{ .Values.ocrWorker.resources.limits.memory | quote }}
