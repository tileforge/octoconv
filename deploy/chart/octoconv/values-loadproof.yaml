# Load-proof overlay — layered ON TOP of values-local.yaml, NEVER standalone
# (same convention as values-e2e.yaml):
#
#   helm install octoconv deploy/chart/octoconv \
#     -f deploy/chart/octoconv/values-local.yaml \
#     -f deploy/chart/octoconv/values-loadproof.yaml -n octoconv
#
# Sets the gate-only knobs needed for the live 0→N→0 load-proof gates
# (plans 28-02/28-03, 46-02/46-03, 50-02/50-03/50-04) to have deterministic
# timing; all are dev/test-only and are never applied to a production
# values file.

keda:
  document:
    # Fast, deterministic 2->1 downscale (Phase 28 D-07/D-08, RESEARCH.md
    # Pitfall 1). cooldownPeriod (values.yaml) governs only the 1->0
    # transition; the standard-HPA-governed N->N-1 step defaults to a 300s
    # stabilization window that would push the SC3 downscale past the long
    # document job's own DOCUMENT_ENGINE_TIMEOUT=300s and silently
    # invalidate the scenario's timing assumptions. 15s makes the downscale
    # observable within the gate's polling window.
    scaleDownStabilizationSeconds: 15
  av:
    # Fast, deterministic 2->1 downscale (Phase 37 D-07 proof #2, SC4,
    # mirrors the document override above). Production
    # keda.av.scaleDownStabilizationSeconds (values.yaml) is 900s, which
    # would push the N->N-1 downscale far past any reasonable gate window.
    # 15s here makes the downscale fire promptly and be observable within
    # scripts/keda-av-downscale-survival.sh's polling window. The av
    # Deployment's pod-termination grace period stays at its PRODUCTION
    # 783s value in every overlay -- that grace is exactly the value SC4
    # validates and MUST NOT be lowered here or anywhere else.
    scaleDownStabilizationSeconds: 15
  ocr:
    # Fast, deterministic 2->1 downscale (Phase 46 OCRP-02, SC3+SC4, mirrors
    # the av override above). Production keda.ocr.scaleDownStabilizationSeconds
    # (values.yaml) is 900s (D-01: 744s worst-case job + ~21% margin), which
    # would push both the SC3 scale-to-0 observation and the SC4 N->N-1
    # downscale far past any reasonable gate window. 15s here makes both
    # observable within scripts/keda-ocr-loadproof.sh /
    # scripts/keda-ocr-downscale-survival.sh's polling windows. The
    # ocr-worker Deployment's pod-termination grace period stays at its
    # PRODUCTION 774s value in every overlay -- that grace is exactly the
    # value SC4 validates and MUST NOT be lowered here or anywhere else.
    scaleDownStabilizationSeconds: 15
  pandoc:
    # This is the one place pandoc genuinely diverges from ocr/av/audio: in
    # PRODUCTION keda.pandoc.scaleDownStabilizationSeconds (values.yaml) is
    # null (D-01 -- the k8s 300s HPA default already covers pandoc's 65s
    # worst-case job with >4x margin), so unlike the siblings above this
    # override is NOT defeating a large production value. It exists because
    # pandoc's measured worst-case single job is only ~32s
    # (html_large->md p95=32.318s at the 4 MiB PANDOC_MAX_INPUT_BYTES cap),
    # which is SHORTER than the sibling gates' 15s stabilization PLUS the
    # metric-propagation lag (Prometheus scrape + KEDA poll + the 15s
    # kube-controller-manager HPA sync). A literal 0 makes the HPA act on
    # the current recommendation as soon as it syncs -- the only way a
    # genuine 2->1 downscale can land inside a live pandoc job window.
    # Emitting 0 (not "unset") is exactly what the falsy-0 guard in
    # scaledobject-pandoc.yaml (HARD-03/D-06) exists to allow, so this
    # overlay doubles as a live exercise of that guard.
    # pollingInterval 3 (values.yaml production default is 10) shortens
    # KEDA's own poll leg of the same lag budget.
    # The pandoc-worker Deployment's pod-termination grace period stays at
    # its PRODUCTION 85s value in every overlay -- that grace is exactly
    # what SC4 validates and MUST NOT be lowered here or anywhere else --
    # and the production cpu "2"/memory "1Gi" limits are likewise untouched
    # (throttling CPU to stretch the job is explicitly rejected: it would
    # risk crossing PANDOC_ENGINE_TIMEOUT=65s and turn a survival proof into
    # a timeout failure).
    scaleDownStabilizationSeconds: 0
    pollingInterval: 3

# Phase 50 (PDCP-02): shortens Prometheus' own scrape cadence for the same
# SC4 metric-propagation lag budget the keda.pandoc override above targets
# -- the gate's api /metrics series must reach Prometheus fast enough for
# the depth drop to reach the HPA while the in-flight pandoc job (~32s) is
# still running. Production stays 15s (values.yaml default, unchanged by
# this overlay's presence in any other class's gate). Values-driven via
# templates/_helpers.tpl octoconv.prometheusScrapeConfig.
prometheus:
  scrapeInterval: "5s"

worker:
  resources:
    limits:
      # Throttle the image worker so the SC1 20-job burst backlog persists
      # long enough for Prometheus (15s scrape) + KEDA (5s poll) + HPA to
      # observe and react (Phase 28 D-05: the fixture/scenario is calibrated
      # so the queue does NOT drain before the scale-up fires). At the
      # production limit of "2" a single worker pod converts a 90MP png in
      # ~0.3s and drains all 20 burst jobs in under 2s -- faster than any
      # scrape can see the backlog (live-benchmarked in octoconv-worker:dev).
      # At 200m each conversion takes ~10s, keeping queue_depth near 20 for
      # well over a minute at 1 replica. memory is inherited from values.yaml.
      cpu: "200m"

documentWorker:
  extraEnv:
    # One job per pod (Phase 28 D-08): with the default ConfigMap value of
    # "2", a single document-worker pod could pick up both the long-first
    # and short-second SC3 jobs, making pod<->job victim selection
    # ambiguous. Forcing concurrency=1 guarantees the submission order
    # (long job first) deterministically maps pod1=long-job, so the
    # downscale-victim annotation targets the correct pod.
    DOCUMENT_WORKER_CONCURRENCY: "1"

pandocWorker:
  extraEnv:
    # One job per pod (Phase 50, mirrors documentWorker.extraEnv above): at
    # the production ConfigMap value of "2" a single pandoc-worker pod can
    # hold two in-flight jobs at once, which makes both the pod<->job
    # mapping and the depth arithmetic ambiguous for the SC4 victim-pod
    # selection. Forcing one job per pod makes "2 replicas, 2 active jobs,
    # 0 pending" a deterministic state whose queue depth is exactly 2, i.e.
    # desired = ceil(2 / threshold 2) = 1, the metric condition that
    # triggers the genuine 2->1 downscale while both pods are mid-job.
    PANDOC_WORKER_CONCURRENCY: "1"
