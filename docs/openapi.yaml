# OctoConv API — OpenAPI 3.1. Import into Yaak: Import -> OpenAPI -> docs/openapi.yaml
openapi: 3.1.0
info:
  title: OctoConv API
  version: "1.0.0"
  description: >-
    Internal asynchronous file-conversion service. Clients upload a file via
    this HTTP API; the server stores it in S3-compatible storage, queues a
    conversion job, and a worker runs the appropriate engine (libvips for
    images, LibreOffice for documents, headless Chromium for HTML, and
    whisper.cpp for audio transcription). This spec describes the API exactly
    as implemented — every path, status code, and error body matches
    internal/api/*.go and internal/auth/*.go verbatim.
servers:
  - url: "{base_url}"
    description: OctoConv API server. Defaults to the local docker-compose deployment.
    variables:
      base_url:
        default: "http://localhost:8090"
        description: Scheme + host + port the API listens on (API_ADDR).
security:
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Unauthenticated liveness/dependency probe.
  - name: Jobs
    description: Create and poll asynchronous conversion jobs.
  - name: Formats
    description: Discover supported (source, target) conversion pairs.
  - name: Inspect
    description: >-
      Synchronously report the truth about an uploaded file's content --
      never a write path, never a rejection on content (Phase 58).
  - name: Presets
    description: Caller-owned (scope=user) named conversion presets.
  - name: System
    description: >-
      Operator-only system-scope (scope=system) presets, visible read-only to
      every client via the merged /v1/presets view. Every operation here
      requires the caller's client_id to be in OPERATOR_CLIENT_IDS; a
      non-operator caller receives the same uniform 404 as any unknown
      preset — never a 403.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        The header value must be the literal scheme token "ApiKey" (matched
        case-insensitively) followed by a single space and the raw API key,
        e.g. `Authorization: ApiKey <key>`. This cannot be expressed with
        `type: http, scheme: apikey` (not a valid OpenAPI security scheme and
        does not import cleanly), so the "ApiKey " prefix is documented here
        instead of modeled structurally. A missing/malformed header returns
        401 {"error":"missing or malformed Authorization header"}; an
        unknown or revoked key returns 401 {"error":"invalid api key"}.

  parameters:
    PresetName:
      name: name
      in: path
      required: true
      description: Preset name.
      schema:
        type: string

  schemas:
    Error:
      type: object
      description: >-
        The flat {"error", "code"} envelope used by EVERY non-2xx JSON
        response from /v1/*. The two and only writers are internal/api's
        writeError (handlers.go) and internal/ratelimit
        (ratelimit.go) — both set code unconditionally, never only on 429.
        code is a machine-readable discriminator enumerated over the closed
        vocabulary frozen by docs/ERROR-CODES.md (milestone v1.13 Phase 56,
        ERRC-01); internal/errcode/openapi_sync_test.go mechanically proves
        this enum never drifts from internal/errcode's Go constants. On a
        429, code distinguishes the two independent producers of that status:
        the per-IP/per-client rate limiter (rate_limited) and the per-client
        quota admission gate (quota_exceeded, QUOT-01..04).
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - unsupported_conversion
            - unsupported_operation
            - invalid_options
            - opts_not_applicable
            - missing_file
            - unknown_preset
            - payload_too_large
            - not_found
            - invalid_cursor
            - already_exists
            - unauthorized
            - quota_exceeded
            - rate_limited
            - inspect_busy
            - unsupported_package
            - internal_error
      required: [error, code]

    JobCreated:
      type: object
      description: Response body for a successfully accepted POST /v1/jobs.
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        opts:
          description: >-
            Present only when normalized opts were applied (echoes them
            back). Shape depends on the target engine — AudioOpts for
            audio-engine jobs, an arbitrary engine-specific object otherwise.
          anyOf:
            - $ref: "#/components/schemas/AudioOpts"
            - type: object
              additionalProperties: true
      required: [job_id, status]

    JobStatus:
      type: object
      description: >-
        Response body for GET /v1/jobs/{id}. download_url is present only
        when status=done; error_code/error_message are present only when
        status=failed (either or both may be set).
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, active, done, failed]
        opts:
          description: >-
            Shape depends on the target engine — AudioOpts for audio-engine
            jobs, an arbitrary engine-specific object otherwise.
          anyOf:
            - $ref: "#/components/schemas/AudioOpts"
            - type: object
              additionalProperties: true
        download_url:
          type: string
          format: uri
          description: >-
            Presigned S3 GET URL of the role=primary output, selected by
            role, never by position. Only present when status=done.
        outputs:
          type: array
          description: >-
            Present only when the job has MORE THAN ONE output, so a
            single-output convert job's response body is unchanged from the
            pre-Phase-57 shape. role values come from job_outputs.role, with
            "primary" being the one presigned into download_url.

            A sanitize job produces a second output with role="report"; its
            body is SanitizeReport. The role is not a closed enum here on
            purpose -- later operations may add their own, and a client that
            hard-codes the current set breaks on the first one.
          items:
            type: object
            properties:
              role:
                type: string
              ordinal:
                type: integer
              format:
                type: string
              size_bytes:
                type: integer
                format: int64
              url:
                type: string
                format: uri
            required: [role, ordinal, format, size_bytes, url]
        error_code:
          type: string
          description: >-
            Machine-readable failure reason, e.g. "duration_exceeded"
            (audio jobs past the configured maximum) or "output_too_large"
            (a tex job whose PDF exceeds the output ceiling). The complete
            list, held equal to the Go constants by a test, is in
            docs/ERROR-CODES.md. Only present when status=failed.
        error_message:
          type: string
          description: Human-readable failure detail. Only present when status=failed.
      required: [job_id, status]

    AudioOpts:
      type: object
      description: Engine-specific opts for audio (whisper) conversions.
      properties:
        language:
          type: string
          enum: [auto, en, ru, es, fr, de]
          description: Omit for whisper's own language auto-detection.
        translate:
          type: boolean
      additionalProperties: false

    EngineFormats:
      type: object
      description: One engine class's supported (source, target) pairs, each rendered as a two-element [from, to] array.
      properties:
        pairs:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
      required: [pairs]

    FormatsResponse:
      type: object
      description: >-
        Registry-derived capability map returned by GET /v1/formats
        (internal/api/formats_handlers.go:41-61). engines is keyed by engine
        class, e.g. "image"; operations is keyed by operation (e.g.
        "convert") then by engine class -- {operation -> engine ->
        EngineFormats} -- and is the discovery path POST /v1/jobs's
        operation field's description points callers at. Both keys are
        emitted unconditionally by handleListFormats, never guarded on
        non-emptiness, so both are required here.
      properties:
        engines:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EngineFormats"
        operations:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/EngineFormats"
      required: [engines, operations]

    PresetRequest:
      type: object
      description: Write DTO for POST/PUT preset endpoints. No scope/client_id field — those are always server-derived.
      properties:
        name:
          type: string
        target_format:
          type: string
        options:
          type: object
          additionalProperties: true
        description:
          type: string
      required: [name, target_format]

    PresetResponse:
      type: object
      description: Read DTO for preset endpoints. Never carries id or client_id.
      properties:
        name:
          type: string
        version:
          type: integer
        scope:
          type: string
          enum: [user, system]
          description: "\"system\" presets are visible but read-only via the /v1/presets surface."
        operation:
          type: string
        target_format:
          type: string
        options:
          type: object
          additionalProperties: true
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, version, scope, operation, target_format, is_active, created_at, updated_at]

    InspectFinding:
      type: object
      description: >-
        One occurrence of a finding code detected inside a file's content
        (INSP-02, Phase 58). code is an OPEN, string-typed identifier from
        the closed Go vocabulary declared in internal/inspect/findings.go
        and documented in docs/FINDINGS.md -- deliberately NOT modeled as a
        closed schema enum here: a future phase may ADD a new code (the Go
        vocabulary is additive-only -- a code, once shipped, is never
        renamed or repurposed, per findings.go's own doc comment), and a
        closed enum in this contract would make that addition a breaking
        change for every existing client, which this vocabulary's own
        stability guarantee forbids. severity is likewise described in
        prose rather than as a schema enum, so this whole object's
        openness reads as one deliberate choice rather than two
        inconsistent ones -- its three actual values (info, warning,
        critical) are declared, closed, and exhaustive in
        internal/inspect/findings.go's own Severity type; see
        docs/FINDINGS.md for the current, authoritative list.
      properties:
        code:
          type: string
          description: See docs/FINDINGS.md for the full, versioned list of finding codes and what each one means.
        severity:
          type: string
          description: >-
            One of "info" (structural fact, no risk by itself), "warning"
            (a passive risk requiring further recipient action to matter),
            or "critical" (can execute or take effect with no further
            recipient action).
        location:
          type: string
          description: >-
            Best-effort, human-facing location -- its SHAPE depends on the
            source that produced it (a zip entry path, a decimal byte
            offset, or absent for a whole-file structural fact). Clients
            MUST treat this as an opaque, human-facing string, never a
            stable machine-readable field.
      required: [code, severity]

    InspectCheck:
      type: object
      description: >-
        The three-value outcome of one named check against one finding
        code that did NOT produce an InspectFinding (INSP-03, Phase 58).
        Every code in the closed vocabulary (docs/FINDINGS.md) appears
        EXACTLY ONCE across one InspectReport's findings and checks
        combined -- never in both, never in neither.
      properties:
        code:
          type: string
          description: See docs/FINDINGS.md.
        status:
          type: string
          description: >-
            A CLOSED, three-value classification. A consumer MUST carry
            three branches, not two: "unknown" is NEITHER a synonym for
            "clean" NOR for "not_applicable" -- collapsing any two of
            these into one branch (e.g. `if status != "clean"`) is exactly
            the defect this three-value scale exists to prevent. "clean"
            means the check applies to this format, ran to completion, and
            found nothing. "not_applicable" means the check does not apply
            to this format at all (NOT "we looked and found nothing").
            "unknown" means the check applies but its result could not be
            determined.
          enum:
            - clean
            - not_applicable
            - unknown
        reason:
          type: string
          description: >-
            Present when status is not "clean". A closed, machine-readable
            explanation (internal/inspect/status.go's Reason type), e.g.
            "compressed_object_streams" (structural blindness about the
            FILE), "parser_unavailable", "malformed_input",
            "work_ceiling_bytes"/"work_ceiling_time" (THIS SERVICE's own
            resource ceiling -- the only two reasons that ever mark
            InspectCoverage.complete false).
      required: [code, status]

    InspectCoverage:
      type: object
      description: >-
        The REPORT-WIDE completeness claim (INSP-03, Phase 58) -- a
        SEPARATE claim from any one InspectCheck's own status. A
        structurally-unknown check (parser blind, format inapplicable,
        malformed input) never makes the report itself incomplete. What does
        is any reason meaning part of the upload was never examined:
        work_ceiling_bytes, work_ceiling_time, and read_failed. See
        docs/FINDINGS.md for the full table and for why malformed_input is
        deliberately NOT among them -- "this file is broken" is a finished
        answer about a file that was actually looked at.
      properties:
        complete:
          type: boolean
        reason:
          type: string
          description: >-
            Present when complete is false. One of work_ceiling_bytes,
            work_ceiling_time, or read_failed -- reported verbatim, never
            re-labelled (a failed read is never presented as an exhausted
            ceiling). When several causes apply, the first one observed is
            reported.
        truncated_checks:
          type: array
          items:
            type: string
          description: >-
            The finding codes whose own check was cut short -- by an
            exhausted ceiling or by a failed read. Present when complete is
            false, EXCEPT when the loss of coverage came from a
            characteristic rather than a check, in which case it is absent:
            a characteristic key names no finding code.
      required: [complete]

    InspectOperation:
      type: object
      description: >-
        One (operation, target) triple offered for the detected format
        (INSP-04, Phase 58): the engine that would serve it, an honest
        UPPER-BOUND duration estimate with its own provenance, a
        DETERMINISTIC availability verdict for a file of this size, and a
        live, read-only quota verdict "as of this request" -- never a
        guarantee the eventual POST /v1/jobs will succeed (Repo.PreAdmit is
        not linearizable under a concurrent burst).

        The two verdicts answer different questions and neither subsumes the
        other. `available` is computed locally and cannot be unknown: false
        means POST /v1/jobs refuses a file of this size for this engine
        every time. `quota.allowed` is a live check that can be true, false,
        or null. An offer appears in the list either way -- being told
        "this conversion exists but your file is too large for it, and the
        ceiling is N bytes" is the reason to call /v1/inspect before
        queueing anything.
      properties:
        operation:
          type: string
        target:
          type: string
        engine:
          type: string
        available:
          type: boolean
          description: >-
            Whether this service would accept a file of the inspected size
            for this (operation, target, engine) triple. false means the
            request is refused DETERMINISTICALLY -- the size exceeds the
            engine's own post-detection ceiling, so POST /v1/jobs answers
            413 payload_too_large no matter what the quota says. This axis
            is deliberately separate from `quota`: a client must be able to
            tell "this service will never take this file" from "your quota
            is exhausted right now", and both can be true on one offer.
        unavailable_reason:
          type: string
          enum: [payload_too_large]
          description: >-
            Present only when available is false, carrying the SAME code
            the eventual POST /v1/jobs rejection carries, so one vocabulary
            covers the offer and the error.
        max_bytes:
          type: integer
          format: int64
          description: >-
            The engine's own post-detection size ceiling, present whether
            or not this file fits it -- a client that knows the limit can
            split or downscale instead of guessing. Absent for an engine
            this deployment does not gate by size.
        estimated_max_seconds:
          type: integer
          description: >-
            An upper bound derived from the per-engine timeout this
            service already enforces on itself -- never a real estimate;
            this project has no historical duration data to derive one
            from.
        estimate_source:
          type: string
          enum: [measured, unmeasured]
          description: >-
            "measured" means the underlying per-engine timeout was derived
            from a real RTF (real-time-factor) measurement against the
            actual worker image. "unmeasured" means it is a starting point
            -- an inherited placeholder or an expectation -- with no
            measurement behind it yet; this flag makes that calibration
            debt visible on the wire instead of letting an unmeasured
            number masquerade as a measured one.
        quota:
          type: object
          properties:
            allowed:
              type: [boolean, "null"]
              description: >-
                null when the pre-admission check itself could not run --
                NEVER true in that case; unknowing is never permission.
            reason:
              type: string
              description: Present when allowed is false or null (null pairs with reason "unknown").
          required: [allowed]
      required: [operation, target, engine, available, estimated_max_seconds, estimate_source, quota]

    InspectReport:
      type: object
      description: >-
        Response body for POST /v1/inspect (INSP-01..INSP-06, Phase 58).
        Returned synchronously, in the same round trip as the upload --
        this endpoint never writes to S3 or Postgres and never pins
        anything a later POST /v1/jobs could use to skip its own
        fail-closed validation (D-09).
      properties:
        format:
          type: string
          description: >-
            Magic-byte-detected format (never the filename extension).
            Empty when nothing recognized the content at all -- this is a
            normal, complete report, never a rejection. An upload this
            service could not READ also reports an empty format: nothing
            about it was recognized, and the accompanying checks carry
            read_failed rather than format_unrecognized so a client can tell
            "I do not handle this file" from "I could not read it".

            Three values are NOT real formats but sentinels for a
            ZIP-shaped upload this service recognized as a container and
            then declined, or failed, to parse -- reported here because
            "this is a zip we did not finish parsing" is more than an empty
            format would say:

            * `zip_directory_too_large` -- the declared central directory
              crosses this service's own structural ceiling, so it was never
              walked (checks carry work_ceiling_bytes).
            * `zip_read_failed` -- the PK prefix was readable but a later
              read of the archive failed (checks carry read_failed).
            * `zip_malformed` -- every byte needed was read and the central
              directory itself does not parse (checks carry
              malformed_input).
        declared_format:
          type: string
          description: >-
            Normalized filename-extension-derived format. NEVER selects
            which characteristics/findings are computed for this file.
        size_bytes:
          type: integer
          format: int64
        characteristics:
          type: object
          additionalProperties: true
          description: >-
            Only keys APPLICABLE to the detected format are present
            (INSP-01). A key whose VALUE is unknown is present with a JSON
            null (an honest "we don't know"); a key that does not apply to
            this format is simply absent.

            PDF uploads additionally carry `text_layer` ("present", "absent",
            or null) and, when it is null, `text_layer_reason` -- whether the
            file already has a usable text layer, so a client can tell a
            born-digital PDF from a scan before submitting a job. The two
            values are NOT symmetric: "present" is reported whenever enough
            text was actually seen, while "absent" requires that everything
            able to hold text was examined, so a truncated or partly
            undecodable scan reports null rather than claiming absence. It is
            advisory -- the worker decides at job time with a different tool,
            and may reach a different answer. See docs/FINDINGS.md.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/InspectFinding"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/InspectCheck"
        coverage:
          $ref: "#/components/schemas/InspectCoverage"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/InspectOperation"
      required:
        - format
        - declared_format
        - size_bytes
        - characteristics
        - findings
        - checks
        - coverage
        - operations

    SanitizeReport:
      type: object
      description: >-
        Body of the role=report output produced by operation=sanitize
        (SANI-05, Phase 60). Downloaded like any other output, via the
        outputs array of GET /v1/jobs/{id}; the sanitized file itself is the
        role=primary output.

        Every field carries codes from a closed vocabulary. There is no
        summary sentence, no verdict, and no boolean, because either would
        assert something the operation never tested: Content Disarm and
        Reconstruction removes carriers and does not determine whether code
        is malicious. Absence of a class from `removed` means "not
        enumerated", never "not present".

        The wording of each code lives in docs/SANITIZE.md and is held equal
        to the Go vocabulary by a bidirectional test, so a code appearing
        here always has a documented meaning.
      properties:
        format:
          type: string
          description: >-
            Normalized SOURCE format that was sanitized — what went in, not
            what came out. For a macro-enabled OOXML upload the two differ:
            sanitizing a .docm reports format "docm" here and delivers a .docx,
            because the sanitizer rewrites the package's content type. Read the
            result's format from the primary output in the outputs array of
            GET /v1/jobs/{id}; this field answers "what was sanitized".
        removed:
          type: array
          description: >-
            Threat classes found and removed. Codes only; see
            docs/SANITIZE.md for what each one means and what exactly is
            removed for it. Consumers MUST tolerate a code they do not
            recognize -- later phases may add classes, and those additions
            are non-breaking only if unknown values are already tolerated.
            Do not generate a closed enum from this list.
          items:
            type: string
            example: javascript
        lost_capabilities:
          type: array
          description: >-
            Document features the sanitization METHOD destroyed as a side
            effect -- fillable forms, bookmarks, the tagged accessibility
            tree, macro functionality. These are COSTS, not threats, and they
            are a separate field for that reason: a lost form is not a found
            attack, and a client reading one list should never meet an entry
            of the other kind in it.

            Empty for the image path, which copies the compressed image data
            byte for byte and therefore loses nothing. Always an array, never
            null.
          items:
            type: string
            example: fillable_form_fields
        verified:
          type: array
          description: >-
            Threat classes an implementation that did NOT perform the removal
            confirmed absent from the output bytes (SANI-04). A separate
            field from `removed` because they are separate claims: "we
            removed JavaScript" describes our code path, "we confirmed no
            JavaScript is present in the output" describes the bytes you are
            about to receive.
          items:
            type: string
            example: javascript
        guarantee_scope:
          type: string
          description: >-
            Fixed pointer to the document stating what the operation does and
            does not claim. Present so that a client reading only this JSON is
            not left with an implied guarantee the JSON never made.
          example: docs/SANITIZE.md#scope-of-the-guarantee
      required: [format, removed, lost_capabilities, verified, guarantee_scope]

    Health:
      type: object
      description: Per-dependency reachability probe result.
      properties:
        postgres:
          type: string
          enum: [ok, unreachable]
        redis:
          type: string
          enum: [ok, unreachable]
        s3:
          type: string
          enum: [ok, unreachable]
        status:
          type: string
          enum: [ok, degraded]
      required: [postgres, redis, s3, status]

  responses:
    Unauthorized:
      description: Missing/malformed Authorization header, or an unknown/revoked API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist, is owned by a different client, or (for /v1/system/presets) the caller is not an operator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        One of two independent producers rejected this request, distinguished
        by the body's code field: the per-IP/per-client rate limiter
        (code=rate_limited, internal/ratelimit) or the per-client quota
        admission gate (code=quota_exceeded, QUOT-01..04, internal/jobs). The
        service never returns 403 for a quota rejection — a quota is a
        consumption limit, not an authorization boundary.
      headers:
        Retry-After:
          description: >-
            Seconds until the caller may retry. For rate_limited, seconds
            until the fixed-window rate-limit resets. For quota_exceeded, the
            derivation depends on which limit was hit: a concurrency
            rejection returns a short fixed hint (long enough not to invite a
            hot retry loop, short enough not to stall a fast client); a daily
            byte- or job-count rejection returns the exact number of seconds
            remaining until the next UTC midnight, when that day's quota
            window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server-side failure (storage, database, or queue).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and dependency reachability probe
      description: >-
        Read-only ping of Postgres, Redis, and S3/MinIO. Public — no API key
        required. Served on TWO listeners as of Phase 58 (D-06/D-08):
        API_ADDR (the same address /v1/* answers on, kept for existing
        operational consumers) and a dedicated HEALTH_ADDR. The response
        body is byte-identical on both — this is a second accept path for
        the exact same handler, not a second endpoint. The Helm chart's
        liveness/readiness probes target HEALTH_ADDR specifically, so a
        burst against API_ADDR cannot delay the probe's own accept path;
        see internal/api/routes.go's HealthRoutes doc comment for what this
        additionally does and does not isolate (the Postgres ping itself
        uses a separate connection pool from the one INSP-04's quota check
        uses, closed independently — HTTP-listener isolation and
        Postgres-pool isolation are two different guarantees).
      security: []
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                postgres: ok
                redis: ok
                s3: ok
                status: ok
        "503":
          description: One or more dependencies unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                postgres: ok
                redis: unreachable
                s3: ok
                status: degraded

  /v1/jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a conversion job
      description: >-
        Uploads a file and queues an asynchronous conversion job. Either
        (target [+ opts]) or preset must be supplied, never both. The
        declared filename extension must match the file's actual (magic-byte
        detected) content, or the request is rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  oneOf:
                    - type: string
                      format: binary
                    - type: array
                      items:
                        type: string
                        format: binary
                      minItems: 1
                      maxItems: 32
                  description: >-
                    The file to convert, repeatable. "One or many" rather than
                    an array, deliberately: prose about repetition does not
                    change a schema's cardinality, so a client generated from a
                    single-binary declaration could not send a project at all --
                    but declaring only an array would change every existing
                    generated single-file signature for a server that still
                    accepts exactly what it always did. Both branches are true
                    of this endpoint. The FIRST part is the document and decides
                    the conversion, and any further parts
                    are attachments stored beside it under their own names --
                    which is how a LaTeX project's \input and \addbibresource
                    resolve. Only the tex engine accepts more than one; every
                    other conversion refuses extra parts with 422 rather than
                    ignoring them. The engine size limit applies to the TOTAL of
                    all parts, and an attachment name must be a plain file name
                    (no path, no leading "-", no control characters), unique
                    within the request, and must not begin with the reserved
                    stems: any name whose part before the first dot is exactly
                    "in" or "out" is refused, because the worker and the engine
                    write files from those stems (in.<source>, in.pdf, in.log,
                    out.<target>). "input.tex" and "outline.tex" are fine --
                    the stem is what is reserved, not the prefix. At most 32
                    parts per job. A name is refused rather than repaired: a
                    repaired name is not the name your document \inputs.
                target:
                  type: string
                  description: Destination format, e.g. "json", "pdf", "webp". Mutually exclusive with preset.
                opts:
                  type: string
                  description: >-
                    A JSON-encoded string of engine-keyed options (e.g.
                    AudioOpts for audio conversions). Mutually exclusive with
                    preset.
                callback_url:
                  type: string
                  format: uri
                  description: Optional SSRF-validated webhook URL notified on completion.
                preset:
                  type: string
                  description: Named server preset supplying target_format and opts. Mutually exclusive with target/opts.
                operation:
                  type: string
                  description: >-
                    The operation to perform. Defaults to "convert" when
                    omitted or empty; compared exactly, no trimming, no
                    case-folding. The currently available set is discoverable
                    via the operations key of GET /v1/formats.

                    "sanitize" rebuilds the file with the enumerated classes of
                    construct removed and produces a second output with
                    role=report describing what was removed, what the method
                    cost, and which classes an independent implementation
                    confirmed absent (see SanitizeReport).

                    The target format is the source format's sanitized form.
                    For PDF and images that is the same format -- sanitize is
                    not a conversion. For macro-enabled OOXML it is the
                    macro-free equivalent: sanitizing a .docm yields a .docx,
                    an .xlsm yields an .xlsx, and so on, because the sanitizer
                    rewrites the package's content type and a file still named
                    .docm would present itself as macro-enabled while
                    containing no macros. Request target=docx for a .docm; the
                    registered pairs are listed under the operations key of
                    GET /v1/formats.

                    Scope: the service removes the enumerated classes and
                    verifies their absence in the output. It does not determine
                    whether a document was malicious, does not detect malicious
                    content outside those classes, and is not a substitute for
                    antivirus scanning. docs/SANITIZE.md carries the full
                    statement and the per-class wording.
              required: [file]
              additionalProperties: false
            examples:
              audioTranscriptRussian:
                summary: Audio transcript (WAV -> plain text, Russian)
                value:
                  file: jfk.wav
                  target: txt
                  opts: '{"language":"ru"}'
              audioTimestampedJSON:
                summary: Audio transcript (WAV -> JSON with word/segment timestamps)
                value:
                  file: jfk.wav
                  target: json
      responses:
        "202":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
              examples:
                queued:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: queued
                queuedWithOpts:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: queued
                    opts:
                      language: ru
        "400":
          description: >-
            Invalid multipart form / missing file / missing target format /
            cannot determine source format from filename / invalid
            callback_url / invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: File exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: file exceeds size limit
                code: payload_too_large
        "422":
          description: >-
            Semantically rejected: unsupported conversion pair, declared
            format mismatch, unrecognized content, invalid/inapplicable
            opts, unknown or inactive preset, macro-carrying document,
            password-protected or legacy Office file, a declared
            size/dimension over the configured limit, extra `file` parts sent
            to a conversion that takes a single file, or a .tex preamble
            loading a package this deployment does not accept -- one the
            TeX bundle cannot resolve, or one it CAN resolve that is
            refused on purpose, such as fontspec and the two
            implementation files it loads (code unsupported_package; the
            message names the package and says which of the two it is).
            That last check reads a BOUNDED window of the preamble and
            abstains when the preamble runs past it -- such a document is
            accepted here and fails later with the SAME code in the job's
            error_code, which is why the two vocabularies share it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/inspect:
    post:
      tags: [Inspect]
      operationId: inspectFile
      summary: Synchronously report the truth about a file's content
      description: >-
        Uploads a file and returns, in the SAME round trip, the format
        detected by magic bytes (never by filename extension), the
        characteristics applicable to that format, a typed findings/checks
        report over a closed vocabulary (docs/FINDINGS.md), and the
        (operation, target) triples available for it with an upper-bound
        duration estimate and a live quota check. This endpoint NEVER
        writes to S3 or Postgres and NEVER rejects on content -- an
        unrecognized upload is a normal 200 with an empty format and
        honest "unknown" statuses, not a 422. It also pins nothing a
        subsequent POST /v1/jobs could use to skip its own fail-closed
        validation: inspecting a file has no effect whatsoever on a later
        job-creation request, even for the identical bytes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to inspect.
              required: [file]
              additionalProperties: false
      responses:
        "200":
          description: >-
            The file was parsed (or, for unrecognized content, honestly
            reported as such). Always 200 -- this endpoint reports, it
            never rejects on content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectReport"
        "400":
          description: Invalid multipart form / missing file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: >-
            Body exceeds this endpoint's OWN upload ceiling
            (INSPECT_MAX_UPLOAD_BYTES) -- separate from and smaller than
            POST /v1/jobs' own MAX_UPLOAD_BYTES, since this endpoint never
            writes the body to S3.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: file exceeds size limit
                code: payload_too_large
        "429":
          description: >-
            One of THREE independent 429 producers rejected this request,
            distinguished by the body's code field: the per-IP/per-client
            rate limiter (rate_limited), this endpoint's OWN, independent
            per-client rate budget (also rate_limited, a smaller RPM than
            the general limit), or the concurrency semaphore bounding how
            many inspect requests may be parsing bytes at once
            (inspect_busy) -- a THIRD, distinct class from both
            rate_limited and quota_exceeded: the service as a whole is at
            its parallel-parsing ceiling, not the caller's own budget.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

