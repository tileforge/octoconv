# OctoConv API — OpenAPI 3.1. Import into Yaak: Import -> OpenAPI -> docs/openapi.yaml
openapi: 3.1.0
info:
  title: OctoConv API
  version: "1.0.0"
  description: >-
    Internal asynchronous file-conversion service. Clients upload a file via
    this HTTP API; the server stores it in S3-compatible storage, queues a
    conversion job, and a worker runs the appropriate engine (libvips for
    images, LibreOffice for documents, headless Chromium for HTML, and
    whisper.cpp for audio transcription). This spec describes the API exactly
    as implemented — every path, status code, and error body matches
    internal/api/*.go and internal/auth/*.go verbatim.
servers:
  - url: "{base_url}"
    description: OctoConv API server. Defaults to the local docker-compose deployment.
    variables:
      base_url:
        default: "http://localhost:8090"
        description: Scheme + host + port the API listens on (API_ADDR).
security:
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Unauthenticated liveness/dependency probe.
  - name: Jobs
    description: Create and poll asynchronous conversion jobs.
  - name: Formats
    description: Discover supported (source, target) conversion pairs.
  - name: Presets
    description: Caller-owned (scope=user) named conversion presets.
  - name: System
    description: >-
      Operator-only system-scope (scope=system) presets, visible read-only to
      every client via the merged /v1/presets view. Every operation here
      requires the caller's client_id to be in OPERATOR_CLIENT_IDS; a
      non-operator caller receives the same uniform 404 as any unknown
      preset — never a 403.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        The header value must be the literal scheme token "ApiKey" (matched
        case-insensitively) followed by a single space and the raw API key,
        e.g. `Authorization: ApiKey <key>`. This cannot be expressed with
        `type: http, scheme: apikey` (not a valid OpenAPI security scheme and
        does not import cleanly), so the "ApiKey " prefix is documented here
        instead of modeled structurally. A missing/malformed header returns
        401 {"error":"missing or malformed Authorization header"}; an
        unknown or revoked key returns 401 {"error":"invalid api key"}.

  parameters:
    PresetName:
      name: name
      in: path
      required: true
      description: Preset name.
      schema:
        type: string

  schemas:
    Error:
      type: object
      description: >-
        The error body used by every non-2xx response EXCEPT 429. 429
        responses use the QuotaError schema below instead, which adds the
        required machine-readable code discriminator.
      properties:
        error:
          type: string
      required: [error]

    QuotaError:
      type: object
      description: >-
        The error body used ONLY by 429 responses. Every other error body in
        this API remains the one-property Error schema above — code is never
        added to any non-429 response. code distinguishes the two producers
        of a 429 in this service: the per-IP/per-client rate limiter
        (rate_limited) and the per-client quota admission gate
        (quota_exceeded, QUOT-01..04).
      properties:
        error:
          type: string
        code:
          type: string
          enum: [quota_exceeded, rate_limited]
      required: [error, code]

    JobCreated:
      type: object
      description: Response body for a successfully accepted POST /v1/jobs.
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        opts:
          description: >-
            Present only when normalized opts were applied (echoes them
            back). Shape depends on the target engine — AudioOpts for
            audio-engine jobs, an arbitrary engine-specific object otherwise.
          anyOf:
            - $ref: "#/components/schemas/AudioOpts"
            - type: object
              additionalProperties: true
      required: [job_id, status]

    JobStatus:
      type: object
      description: >-
        Response body for GET /v1/jobs/{id}. download_url is present only
        when status=done; error_code/error_message are present only when
        status=failed (either or both may be set).
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, active, done, failed]
        opts:
          description: >-
            Shape depends on the target engine — AudioOpts for audio-engine
            jobs, an arbitrary engine-specific object otherwise.
          anyOf:
            - $ref: "#/components/schemas/AudioOpts"
            - type: object
              additionalProperties: true
        download_url:
          type: string
          format: uri
          description: Presigned S3 GET URL for the first output. Only present when status=done.
        error_code:
          type: string
          description: >-
            Machine-readable failure reason. Known value: "duration_exceeded"
            (audio jobs whose declared duration exceeds the configured
            maximum). Only present when status=failed.
        error_message:
          type: string
          description: Human-readable failure detail. Only present when status=failed.
      required: [job_id, status]

    AudioOpts:
      type: object
      description: Engine-specific opts for audio (whisper) conversions.
      properties:
        language:
          type: string
          enum: [auto, en, ru, es, fr, de]
          description: Omit for whisper's own language auto-detection.
        translate:
          type: boolean
      additionalProperties: false

    FormatsResponse:
      type: object
      description: >-
        Registry-derived capability map: for each engine class, every
        (source, target) pair it currently supports.
      properties:
        engines:
          type: object
          additionalProperties:
            type: object
            properties:
              pairs:
                type: array
                items:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 2
      required: [engines]

    PresetRequest:
      type: object
      description: Write DTO for POST/PUT preset endpoints. No scope/client_id field — those are always server-derived.
      properties:
        name:
          type: string
        target_format:
          type: string
        options:
          type: object
          additionalProperties: true
        description:
          type: string
      required: [name, target_format]

    PresetResponse:
      type: object
      description: Read DTO for preset endpoints. Never carries id or client_id.
      properties:
        name:
          type: string
        version:
          type: integer
        scope:
          type: string
          enum: [user, system]
          description: "\"system\" presets are visible but read-only via the /v1/presets surface."
        operation:
          type: string
        target_format:
          type: string
        options:
          type: object
          additionalProperties: true
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, version, scope, operation, target_format, is_active, created_at, updated_at]

    Health:
      type: object
      description: Per-dependency reachability probe result.
      properties:
        postgres:
          type: string
          enum: [ok, unreachable]
        redis:
          type: string
          enum: [ok, unreachable]
        s3:
          type: string
          enum: [ok, unreachable]
        status:
          type: string
          enum: [ok, degraded]
      required: [postgres, redis, s3, status]

  responses:
    Unauthorized:
      description: Missing/malformed Authorization header, or an unknown/revoked API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist, is owned by a different client, or (for /v1/system/presets) the caller is not an operator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        One of two independent producers rejected this request, distinguished
        by the body's code field: the per-IP/per-client rate limiter
        (code=rate_limited, internal/ratelimit) or the per-client quota
        admission gate (code=quota_exceeded, QUOT-01..04, internal/jobs). The
        service never returns 403 for a quota rejection — a quota is a
        consumption limit, not an authorization boundary.
      headers:
        Retry-After:
          description: >-
            Seconds until the caller may retry. For rate_limited, seconds
            until the fixed-window rate-limit resets. For quota_exceeded, the
            derivation depends on which limit was hit: a concurrency
            rejection returns a short fixed hint (long enough not to invite a
            hot retry loop, short enough not to stall a fast client); a daily
            byte- or job-count rejection returns the exact number of seconds
            remaining until the next UTC midnight, when that day's quota
            window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuotaError"
    InternalError:
      description: Unexpected server-side failure (storage, database, or queue).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and dependency reachability probe
      description: Read-only ping of Postgres, Redis, and S3/MinIO. Public — no API key required.
      security: []
      responses:
        "200":
          description: All dependencies reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                postgres: ok
                redis: ok
                s3: ok
                status: ok
        "503":
          description: One or more dependencies unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                postgres: ok
                redis: unreachable
                s3: ok
                status: degraded

  /v1/jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a conversion job
      description: >-
        Uploads a file and queues an asynchronous conversion job. Either
        (target [+ opts]) or preset must be supplied, never both. The
        declared filename extension must match the file's actual (magic-byte
        detected) content, or the request is rejected.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to convert.
                target:
                  type: string
                  description: Destination format, e.g. "json", "pdf", "webp". Mutually exclusive with preset.
                opts:
                  type: string
                  description: >-
                    A JSON-encoded string of engine-keyed options (e.g.
                    AudioOpts for audio conversions). Mutually exclusive with
                    preset.
                callback_url:
                  type: string
                  format: uri
                  description: Optional SSRF-validated webhook URL notified on completion.
                preset:
                  type: string
                  description: Named server preset supplying target_format and opts. Mutually exclusive with target/opts.
              required: [file]
              additionalProperties: false
            examples:
              audioTranscriptRussian:
                summary: Audio transcript (WAV -> plain text, Russian)
                value:
                  file: jfk.wav
                  target: txt
                  opts: '{"language":"ru"}'
              audioTimestampedJSON:
                summary: Audio transcript (WAV -> JSON with word/segment timestamps)
                value:
                  file: jfk.wav
                  target: json
      responses:
        "202":
          description: Job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
              examples:
                queued:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: queued
                queuedWithOpts:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: queued
                    opts:
                      language: ru
        "400":
          description: >-
            Invalid multipart form / missing file / missing target format /
            cannot determine source format from filename / invalid
            callback_url / invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: File exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: file exceeds size limit
        "422":
          description: >-
            Semantically rejected: unsupported conversion pair, declared
            format mismatch, unrecognized content, invalid/inapplicable
            opts, unknown or inactive preset, macro-carrying document,
            password-protected or legacy Office file, or a declared
            size/dimension over the configured limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job status (and download URL once done)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found and visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
              examples:
                queued:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: queued
                done:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: done
                    download_url: "https://minio.example/results/3fa85f64.../0-jfk.txt?X-Amz-Signature=..."
                failedDurationExceeded:
                  value:
                    job_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    status: failed
                    error_code: duration_exceeded
                    error_message: declared audio duration exceeds the configured maximum
        "400":
          description: Invalid job id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid job id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found (also returned for a job owned by a different client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: job not found
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/formats:
    get:
      tags: [Formats]
      operationId: listFormats
      summary: List supported (source, target) conversion pairs per engine class
      responses:
        "200":
          description: Registry-derived capability map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormatsResponse"
              example:
                engines:
                  image:
                    pairs:
                      - [png, jpg]
                      - [png, webp]
                      - [png, heic]
                      - [png, tiff]
                      - [jpg, png]
                      - [jpg, webp]
                      - [jpg, heic]
                      - [jpg, tiff]
                      - [webp, png]
                      - [webp, jpg]
                      - [webp, heic]
                      - [webp, tiff]
                      - [heic, png]
                      - [heic, jpg]
                      - [heic, webp]
                      - [heic, tiff]
                      - [tiff, png]
                      - [tiff, jpg]
                      - [tiff, webp]
                      - [tiff, heic]
                  document:
                    pairs:
                      - [docx, pdf]
                      - [odt, pdf]
                      - [xlsx, pdf]
                      - [ods, pdf]
                      - [pptx, pdf]
                      - [odp, pdf]
                      - [docx, odt]
                      - [odt, docx]
                      - [xlsx, ods]
                      - [ods, xlsx]
                      - [pptx, odp]
                      - [odp, pptx]
                  html:
                    pairs:
                      - [html, pdf]
                  audio:
                    pairs:
                      - [mp3, txt]
                      - [mp3, srt]
                      - [mp3, vtt]
                      - [mp3, json]
                      - [wav, txt]
                      - [wav, srt]
                      - [wav, vtt]
                      - [wav, json]
                      - [m4a, txt]
                      - [m4a, srt]
                      - [m4a, vtt]
                      - [m4a, json]
                      - [ogg, txt]
                      - [ogg, srt]
                      - [ogg, vtt]
                      - [ogg, json]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/presets:
    post:
      tags: [Presets]
      operationId: createPreset
      summary: Create a caller-owned (scope=user) preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetRequest"
      responses:
        "201":
          description: Preset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A preset with this name already exists for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: preset already exists
        "422":
          description: Invalid opts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Presets]
      operationId: listPresets
      summary: List the caller's effective presets (own + merged system presets)
      parameters:
        - name: all
          in: query
          required: false
          description: When "true", includes inactive preset versions.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Effective preset list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/presets/{name}:
    get:
      tags: [Presets]
      operationId: showPreset
      summary: Get the effective preset for {name} (user override wins over same-name system preset)
      parameters:
        - $ref: "#/components/parameters/PresetName"
      responses:
        "200":
          description: Preset found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Presets]
      operationId: updatePreset
      summary: Update the caller's OWN (scope=user) preset named {name} (bumps version)
      parameters:
        - $ref: "#/components/parameters/PresetName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetRequest"
      responses:
        "200":
          description: Preset updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Preset not found. Also returned for a preset owned by a
            different client, or a same-name system-scope preset (write
            access to system presets is not exposed on this route).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: preset not found
        "422":
          description: Invalid opts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Presets]
      operationId: deactivatePreset
      summary: Soft-deactivate the caller's OWN (scope=user) preset named {name}
      parameters:
        - $ref: "#/components/parameters/PresetName"
      responses:
        "200":
          description: Preset deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  is_active:
                    type: boolean
                    enum: [false]
                required: [name, is_active]
              example:
                name: my-preset
                is_active: false
        "400":
          description: Invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/system/presets:
    post:
      tags: [System]
      operationId: createSystemPreset
      summary: Create a system-scope (scope=system) preset — operator only
      description: Operator-only. A non-operator caller receives 404, never 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetRequest"
      responses:
        "201":
          description: System preset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: preset not found
        "409":
          description: A system preset with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid opts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [System]
      operationId: listSystemPresets
      summary: List every system-scope preset — operator only
      description: Operator-only. A non-operator caller receives 404, never 403.
      parameters:
        - name: all
          in: query
          required: false
          description: When "true", includes inactive preset versions.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: System preset list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/system/presets/{name}:
    get:
      tags: [System]
      operationId: showSystemPreset
      summary: Get a system-scope preset by name — operator only
      description: Operator-only. A non-operator caller receives 404, never 403.
      parameters:
        - $ref: "#/components/parameters/PresetName"
      responses:
        "200":
          description: System preset found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [System]
      operationId: updateSystemPreset
      summary: Update a system-scope preset by name (bumps version) — operator only
      description: Operator-only. A non-operator caller receives 404, never 403.
      parameters:
        - $ref: "#/components/parameters/PresetName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetRequest"
      responses:
        "200":
          description: System preset updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetResponse"
        "400":
          description: Invalid preset name, or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid opts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [System]
      operationId: deactivateSystemPreset
      summary: Soft-deactivate a system-scope preset by name — operator only
      description: Operator-only. A non-operator caller receives 404, never 403.
      parameters:
        - $ref: "#/components/parameters/PresetName"
      responses:
        "200":
          description: System preset deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  is_active:
                    type: boolean
                    enum: [false]
                required: [name, is_active]
        "400":
          description: Invalid preset name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/system/usage:
    get:
      tags: [System]
      operationId: getSystemUsage
      summary: Per-client, per-engine usage, limits and remaining budget — operator only
      description: >-
        Operator-only (OPSV-01/OPSV-02). Backed by the client_usage_daily
        rollup (terminal usage) plus live in-flight (queued/active) jobs —
        never Prometheus, never a raw jobs table scan. The response carries
        each (client, engine) row's usage alongside its configured limits and
        remaining budget in one round trip. day_from/day_to are resolved from
        the database server's own clock, not the API host's wall clock, so
        they always agree with the day the admission gate itself enforces.
        remaining's arithmetic mirrors the admission gate (evaluate(),
        internal/jobs/admission.go) exactly: concurrency remaining is
        in-flight only, daily-bytes remaining sums terminal bytes_in plus
        in-flight input bytes (never bytes_out), and daily-jobs remaining
        sums terminal job_count plus in-flight job count. That arithmetic
        matching evaluate() is a DIFFERENT claim from "the gate is actually
        enforcing right now" — see remaining_matches_admission_gate,
        remaining_semantics and quota_enforcement_disabled below. A
        non-operator caller receives 404, never 403 — byte-identical to
        /v1/system/presets's no-leak 404. A client_id that matches a real but
        idle, unlimited client returns exactly one row, whereas a client_id
        matching no client returns an empty usage array — the two are
        deliberately distinguishable for operators.
      parameters:
        - name: period
          in: query
          required: false
          description: >-
            The usage window. Defaults to "today" when omitted or present-but-
            empty. Only period=today's remaining figures match what the
            admission gate computes right now (remaining_matches_admission_gate);
            7d/30d compare a multi-day sum against a one-day cap and carry an
            explicit non-authoritative caveat instead.
          schema:
            type: string
            enum: [today, 7d, 30d]
            default: today
        - name: client_id
          in: query
          required: false
          description: Narrow the response to one client. Omit for all clients, sorted by consumption descending.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Per-client, per-engine usage merged with limits and remaining budget for the resolved period.
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: string
                    enum: [today, 7d, 30d]
                    description: The resolved period.
                  day_from:
                    type: string
                    format: date
                    description: Inclusive UTC start date actually queried.
                  day_to:
                    type: string
                    format: date
                    description: Inclusive UTC end date actually queried.
                  quota_enforcement_disabled:
                    type: boolean
                    description: >-
                      The service-wide QUOTA_ENFORCEMENT_DISABLED kill-switch
                      state, always present regardless of period. When true,
                      every quota verdict on every client/engine is still
                      computed and counted but nothing is ever rejected, and
                      remaining_matches_admission_gate is therefore false even
                      for period=today. This is the only way an operator can
                      observe this state — no per-row field carries it.
                  remaining_matches_admission_gate:
                    type: boolean
                    description: >-
                      true only when period=today AND
                      quota_enforcement_disabled is false — the ONLY
                      combination where remaining is exactly what the
                      admission gate (evaluate()) would decide right now. A
                      per-row enforcement_mode of "observe" means that row's
                      own verdict is computed and counted but never enforced,
                      even when this field is true for the response as a
                      whole — see remaining_note on each response for the
                      per-row caveat.
                  remaining_semantics:
                    type: string
                    enum: [live_admission_gate, computed_but_not_enforced, hypothetical_single_day_equivalent]
                    description: >-
                      "live_admission_gate" for period=today with
                      quota_enforcement_disabled false. "computed_but_not_enforced"
                      for period=today when quota_enforcement_disabled is
                      true: the arithmetic is exactly evaluate()'s, but no
                      request is being rejected service-wide. For 7d/30d,
                      "hypothetical_single_day_equivalent" always wins
                      regardless of the kill-switch: remaining compares a
                      multi-day sum against a DAILY cap, has no
                      admission-gate analogue, and will legitimately be
                      negative for healthy clients.
                  remaining_note:
                    type: string
                    description: Human-readable expansion of remaining_matches_admission_gate / remaining_semantics / quota_enforcement_disabled.
                  usage:
                    type: array
                    description: >-
                      Non-nil, possibly empty — an empty result marshals as
                      [], never null. Every client visible to the limits
                      read appears at least once, even with zero usage and
                      no configured limits; only a client_id matching no
                      client yields [].
                    items:
                      type: object
                      properties:
                        client_id:
                          type: string
                          format: uuid
                        client_name:
                          type: string
                        engine:
                          type: string
                          description: >-
                            An empty string means the client had no usage
                            and no configured limits for the resolved
                            period — an "exists, unlimited, idle" row. A
                            non-empty value is a real engine class.
                        enforcement_mode:
                          type: string
                          enum: [observe, enforce]
                          description: >-
                            This client's configured enforcement mode for
                            this engine. "observe" (the default for every
                            provisioned client) means the admission gate
                            computes and counts a verdict for this row but
                            never rejects on it — a negative remaining on an
                            observe-mode row does not mean requests are being
                            rejected.
                        used_terminal:
                          type: object
                          description: Terminal (done/failed/canceled) usage over the resolved period, from client_usage_daily.
                          properties:
                            job_count: { type: integer }
                            bytes_in: { type: integer }
                            bytes_out: { type: integer }
                          required: [job_count, bytes_in, bytes_out]
                        used_in_flight:
                          type: object
                          description: Live (queued/active) usage right now, date-agnostic — an in-flight job has no outputs yet.
                          properties:
                            job_count: { type: integer }
                            bytes_in: { type: integer }
                          required: [job_count, bytes_in]
                        limits:
                          type: object
                          description: This client's configured per-engine limits. Every field is null when unlimited — never 0, never omitted; an explicit max_concurrent of 0 (deny-all) stays distinguishable as a non-null 0.
                          properties:
                            max_concurrent:
                              type: [integer, "null"]
                            max_daily_bytes:
                              type: [integer, "null"]
                            max_daily_jobs:
                              type: [integer, "null"]
                          required: [max_concurrent, max_daily_bytes, max_daily_jobs]
                        remaining:
                          type: object
                          description: Per-dimension remaining budget, null exactly when the matching limit is null, and NOT clamped at zero — a negative value is informative, showing how far over budget a client is.
                          properties:
                            concurrent:
                              type: [integer, "null"]
                            daily_bytes:
                              type: [integer, "null"]
                            daily_jobs:
                              type: [integer, "null"]
                          required: [concurrent, daily_bytes, daily_jobs]
                      required: [client_id, client_name, engine, enforcement_mode, used_terminal, used_in_flight, limits, remaining]
                required: [period, day_from, day_to, quota_enforcement_disabled, remaining_matches_admission_gate, remaining_semantics, remaining_note, usage]
        "400":
          description: Malformed client_id (not a valid UUID).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid client_id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Caller is not an authorized operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: preset not found
        "422":
          description: Invalid period filter — not one of today/7d/30d.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid period filter
        "429":
          $ref: "#/components/responses/TooManyRequests"
