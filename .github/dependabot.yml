version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /cmd/cad-worker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts/cad-measure
    # Version updates only: keep fixed OCP/VTK benchmark variants out of the schedule.
    # Security PRs can still touch these files. Regenerate and validate them through
    # lock.sh before merging; see scripts/cad-measure/README.md.
    exclude-paths:
      - "requirements-ocp-*.txt"
      - "requirements-vtk.txt"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      measure-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
