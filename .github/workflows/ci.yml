name: ci

# Автоматические триггеры выключены 2026-08-30: лимиты GitHub Actions на
# исходе, а этот воркфлоу срабатывал дважды за цикл (на пуш ветки и на
# открытие PR). Гейты прогоняются локально:
#   go build ./... && go vet ./... && go test ./...
# Откат — раскомментировать следующую строку и убрать `on: workflow_dispatch`
# под ней. Ключ `on:` обязателен, поэтому он не удалён, а заменён: без него
# GitHub считает файл невалидным воркфлоу.
# on: [push, pull_request]
on: workflow_dispatch

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chart validation (SEED-011/CAPA-01, D-06): helm lint + helm template for
  # both the default values and the values-capacity-floor.yaml overlay,
  # per-class isolation diff (proves SC2 — only the image ScaledObject
  # changes), and two negative cases proving the D-02 fail-fast validation
  # actually fires. No cluster, no external services; independent of the Go
  # Tier 1-4 chain below and runs in parallel with `gate`.
  helm:
    runs-on: ubuntu-latest
    # No secrets and no write scope are needed by this job (chart lint/render
    # only, using local placeholder --set values below) — least privilege
    # default for this file's first non-actions/*, non-docker/* action
    # (T-54-03).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          # Pinned to the exact version the local dev toolchain runs
          # (`helm version --short` -> v4.2.3): without pinning this input,
          # the action installs whatever "latest" is that day and chart
          # render behavior could change with no commit to this repo.
          version: v4.2.3
      - name: Lint, render, isolate, and prove D-02 validation fires
        shell: bash
        run: ./scripts/ci-helm-checks.sh
        # The checks themselves live in that script, not inline here, so the
        # local stand-in for this pipeline (scripts/ci-local.sh, used while
        # GitHub Actions is unavailable) runs the SAME assertions rather than
        # a copy that can drift from them.

  # Tier 1: fast gate — gofmt/vet/build/test, no external services.
  # internal/e2e self-skips here (E2E_BASE_URL unset), keeping this tier
  # offline-safe (SC1).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -timeout 10m

  # Tier 2: race detector. No DB service — DATABASE_URL-gated tests (e.g. the
  # reconciler soak test) self-skip offline; DEBT-07 already made the rest
  # race-clean (SC2). Explicit -timeout override per Pitfall 7 — never the
  # 10-minute default, since -race overhead can push a real-wall-clock test
  # past it.
  race:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test -race ./... -timeout 20m

  # Tier 3: build all 12 compose bake targets, verify they build, warm the GHA
  # layer cache per-target (Pitfalls 1/3/4). Verification-only: load: false,
  # no compose stack is brought up here.
  docker-build:
    needs: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
      - uses: docker/setup-buildx-action@v4
      # The tex bundle is 122 MiB of build output, published as a release asset
      # and gitignored -- so a checkout does NOT contain it, and
      # Dockerfile.tectonic-worker COPYs it from the build context. Without this
      # step the tectonic-worker target fails with
      # `"/deploy/tectonic-bundle/octoconv-bundle.ttb": not found`, which says
      # nothing about where the file comes from. Found in review (PR #16): the
      # fetch was documented in a Dockerfile comment, and a manual step nothing
      # runs is a step that does not happen.
      #
      # GITHUB_TOKEN's default contents:read is enough for a release in this
      # same repository, so no extra secret is involved.
      - name: Fetch the tectonic bundle into the build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/tectonic-bundle-fetch.sh
      - uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: false
          set: |
            api.cache-to=type=gha,mode=max,scope=api
            api.cache-from=type=gha,scope=api
            worker.cache-to=type=gha,mode=max,scope=worker
            worker.cache-from=type=gha,scope=worker
            webhook-worker-1.cache-to=type=gha,mode=max,scope=webhook-worker
            webhook-worker-1.cache-from=type=gha,scope=webhook-worker
            webhook-worker-2.cache-to=type=gha,mode=max,scope=webhook-worker
            webhook-worker-2.cache-from=type=gha,scope=webhook-worker
            probe-worker.cache-to=type=gha,mode=max,scope=probe-worker
            probe-worker.cache-from=type=gha,scope=probe-worker
            tectonic-worker.cache-to=type=gha,mode=max,scope=tectonic-worker
            tectonic-worker.cache-from=type=gha,scope=tectonic-worker

  # Tier 4: live E2E against the real compose stack (docker-compose.yml +
  # docker-compose.e2e.yml — the ONLY job referencing the .e2e.yml override,
  # confining its SSRF-guard relaxation to this test-only context).
  # ADVISORY on PR (continue-on-error true), REQUIRED on main-push (SC4).
  e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@v4
      # This job is a SEPARATE runner with its own fresh checkout, so the fetch
      # in docker-build does not carry over -- and the bake below has no
      # `targets:`, so it evaluates every service in docker-compose.yml,
      # tectonic-worker included. Without this the E2E tier dies on the same
      # missing COPY source the docker-build tier used to. Found in review
      # (PR #16, codex round 2): the round-1 fix was applied to one of the two
      # jobs that bake.
      - name: Fetch the tectonic bundle into the build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/tectonic-bundle-fetch.sh
      # Reload images from the docker-build-tier-warmed GHA cache (near-instant:
      # same scopes as above).
      - uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            worker.cache-from=type=gha,scope=worker
            webhook-worker-1.cache-from=type=gha,scope=webhook-worker
            webhook-worker-2.cache-from=type=gha,scope=webhook-worker
            probe-worker.cache-from=type=gha,scope=probe-worker
            tectonic-worker.cache-from=type=gha,scope=tectonic-worker
      - name: Bring up compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
        # deliberately NOT --build here: images are already loaded and tagged
        # by bake above under the same {project}-{service} names compose
        # expects.
      - name: Wait for API readiness
        run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8090/healthz
      - name: Run migrations
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://octo:octo-pass@localhost:5434/octo_db
      - name: Run E2E suite
        run: go test ./internal/e2e/... -timeout 30m
        env:
          E2E_BASE_URL: http://localhost:8090
          DATABASE_URL: postgres://octo:octo-pass@localhost:5434/octo_db
          API_KEY_SALT: dev-only-change-me-in-real-deploys
          WEBHOOK_SIGNING_SECRET: dev-only-change-me-in-real-deploys
          # presigned host minio:9000 isn't runner-resolvable from the host
          # process running `go test`; redirect the presigned-download dial
          # to the published MinIO port instead.
          E2E_S3_DIAL_ADDR: 127.0.0.1:9100
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
