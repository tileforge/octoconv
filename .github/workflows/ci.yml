name: ci

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chart validation (SEED-011/CAPA-01, D-06): helm lint + helm template for
  # both the default values and the values-capacity-floor.yaml overlay,
  # per-class isolation diff (proves SC2 — only the image ScaledObject
  # changes), and two negative cases proving the D-02 fail-fast validation
  # actually fires. No cluster, no external services; independent of the Go
  # Tier 1-4 chain below and runs in parallel with `gate`.
  helm:
    runs-on: ubuntu-latest
    # No secrets and no write scope are needed by this job (chart lint/render
    # only, using local placeholder --set values below) — least privilege
    # default for this file's first non-actions/*, non-docker/* action
    # (T-54-03).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          # Pinned to the exact version the local dev toolchain runs
          # (`helm version --short` -> v4.2.3): without pinning this input,
          # the action installs whatever "latest" is that day and chart
          # render behavior could change with no commit to this repo.
          version: v4.2.3
      - name: Lint, render, isolate, and prove D-02 validation fires
        shell: bash
        run: |
          set -euo pipefail

          CHART=deploy/chart/octoconv
          OVERLAY=deploy/chart/octoconv/values-capacity-floor.yaml

          # Placeholder secrets (dev-only, never real credentials): base
          # values.yaml intentionally ships no `secrets:` block (always
          # supplied by an overlay or --set in real usage), so a bare helm
          # invocation fails on templates/secret.yaml before ever reaching a
          # KEDA template. See 54-01-SUMMARY.md Interface Contract.
          SECRETS_SET="--set secrets.databaseUrl=x --set secrets.apiKeySalt=x --set secrets.webhookSigningSecret=x --set secrets.s3AccessKey=x --set secrets.s3SecretKey=x --set secrets.postgresPassword=x"

          # --set keda.enabled=true --set prometheus.enabled=true is
          # MANDATORY on every helm lint/helm template invocation below.
          # Every ScaledObject template is gated on
          # `and .Values.keda.enabled .Values.prometheus.enabled` (the
          # chart's co-dependency guard); omitting either flag renders ZERO
          # ScaledObjects and makes every assertion in this job pass
          # vacuously. Do not "clean up" these flags.

          echo "### helm lint (default values)"
          helm lint "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET

          echo "### helm lint (capacity-floor overlay)"
          helm lint "$CHART" -f "$OVERLAY" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET

          echo "### render both variants"
          DEFAULT_RENDER=$(mktemp)
          OVERLAY_RENDER=$(mktemp)
          helm template octoconv "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET > "$DEFAULT_RENDER"
          helm template octoconv "$CHART" -f "$OVERLAY" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET > "$OVERLAY_RENDER"

          echo "### anti-vacuity gate: exactly 7 ScaledObjects must render in BOTH files, checked before any diff or isolation claim"
          # `grep -c` exits 1 on zero matches, and under `set -euo pipefail` an
          # assignment whose command substitution fails kills the script. Zero
          # matches is EXACTLY the vacuity case this gate exists to report, so
          # without `|| true` the diagnostic below would be unreachable in the
          # only case it matters (same hazard the `grep -v` capture further
          # down is already guarded against).
          DEFAULT_COUNT=$(grep -c '^kind: ScaledObject' "$DEFAULT_RENDER" || true)
          OVERLAY_COUNT=$(grep -c '^kind: ScaledObject' "$OVERLAY_RENDER" || true)
          if [ "$DEFAULT_COUNT" -ne 7 ] || [ "$OVERLAY_COUNT" -ne 7 ]; then
            echo "FAIL: expected 7 ScaledObjects in both renders, got default=$DEFAULT_COUNT overlay=$OVERLAY_COUNT"
            exit 1
          fi
          echo "OK: 7 ScaledObjects in both renders"

          echo "### per-class isolation (SC2): the six non-image classes must render byte-identical, image must differ -- specific about WHICH object changed, not just that the diff is small"
          for class in document html audio av ocr pandoc; do
            d1=$(helm template octoconv "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --show-only "templates/scaledobject-${class}.yaml")
            d2=$(helm template octoconv "$CHART" -f "$OVERLAY" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --show-only "templates/scaledobject-${class}.yaml")
            if [ "$d1" != "$d2" ]; then
              echo "FAIL: class $class changed but should be isolated from the image-only overlay"
              diff <(echo "$d1") <(echo "$d2") || true
              exit 1
            fi
            echo "OK: $class unchanged"
          done

          d1=$(helm template octoconv "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --show-only templates/scaledobject-image.yaml)
          d2=$(helm template octoconv "$CHART" -f "$OVERLAY" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --show-only templates/scaledobject-image.yaml)
          if [ "$d1" == "$d2" ]; then
            echo "FAIL: expected image class to DIFFER between default and overlay renders"
            exit 1
          fi
          echo "OK: image changed (expected)"

          echo "### whole-chart isolation scope (SC2): every differing line in the full-chart diff must be a minReplicaCount:/replicas: line, and the diff must be non-empty"
          DIFF_OUT=$(diff "$DEFAULT_RENDER" "$OVERLAY_RENDER" || true)
          CHANGED_LINES=$(echo "$DIFF_OUT" | grep '^[<>]' || true)
          if [ -z "$CHANGED_LINES" ]; then
            echo "FAIL: overlay produced no diff at all -- a no-op overlay must not pass"
            exit 1
          fi
          # grep -v exits 1 when nothing is left unmatched; guard the count
          # capture against that under set -e/pipefail with an explicit
          # `|| true` fallback rather than letting the pipeline abort.
          OUT_OF_SCOPE=$(echo "$CHANGED_LINES" | { grep -vE '(minReplicaCount:|replicas:)' || true; } | wc -l | tr -d ' ')
          if [ "$OUT_OF_SCOPE" -ne 0 ]; then
            echo "FAIL: diff touched lines outside minReplicaCount:/replicas:"
            echo "$CHANGED_LINES" | grep -vE '(minReplicaCount:|replicas:)' || true
            exit 1
          fi
          echo "OK: whole-chart diff scoped to minReplicaCount:/replicas: only"
          rm -f "$DEFAULT_RENDER" "$OVERLAY_RENDER"

          echo "### negative case A -- floor above ceiling (D-02): helm template MUST exit non-zero"
          set +e
          OUT_A=$(helm template octoconv "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --set keda.image.minReplicaCount=99 2>&1)
          RC_A=$?
          set -e
          echo "$OUT_A"
          if [ "$RC_A" -eq 0 ]; then
            echo "FAIL: expected D-02's exceeds-maxReplicaCount guard to fire on this override, but helm template exited 0"
            exit 1
          fi
          echo "$OUT_A" | grep -q 'keda.image.minReplicaCount'
          echo "$OUT_A" | grep -q 'keda.image.maxReplicaCount'
          echo "OK: negative case A failed as expected (rc=$RC_A)"

          echo "### negative case B -- negative floor (D-02): helm template MUST exit non-zero"
          set +e
          OUT_B=$(helm template octoconv "$CHART" --set keda.enabled=true --set prometheus.enabled=true $SECRETS_SET --set 'keda.ocr.minReplicaCount=-1' 2>&1)
          RC_B=$?
          set -e
          echo "$OUT_B"
          if [ "$RC_B" -eq 0 ]; then
            echo "FAIL: expected D-02's negative-value guard to fire on this override, but helm template exited 0"
            exit 1
          fi
          echo "$OUT_B" | grep -q 'keda.ocr.minReplicaCount'
          echo "OK: negative case B failed as expected (rc=$RC_B)"

  # Tier 1: fast gate — gofmt/vet/build/test, no external services.
  # internal/e2e self-skips here (E2E_BASE_URL unset), keeping this tier
  # offline-safe (SC1).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -timeout 5m

  # Tier 2: race detector. No DB service — DATABASE_URL-gated tests (e.g. the
  # reconciler soak test) self-skip offline; DEBT-07 already made the rest
  # race-clean (SC2). Explicit -timeout override per Pitfall 7 — never the
  # 10-minute default, since -race overhead can push a real-wall-clock test
  # past it.
  race:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test -race ./... -timeout 10m

  # Tier 3: build all 10 compose bake targets, verify they build, warm the GHA
  # layer cache per-target (Pitfalls 1/3/4). Verification-only: load: false,
  # no compose stack is brought up here.
  docker-build:
    needs: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: false
          set: |
            api.cache-to=type=gha,mode=max,scope=api
            api.cache-from=type=gha,scope=api
            worker.cache-to=type=gha,mode=max,scope=worker
            worker.cache-from=type=gha,scope=worker
            document-worker.cache-to=type=gha,mode=max,scope=document-worker
            document-worker.cache-from=type=gha,scope=document-worker
            chromium-worker.cache-to=type=gha,mode=max,scope=chromium-worker
            chromium-worker.cache-from=type=gha,scope=chromium-worker
            webhook-worker-1.cache-to=type=gha,mode=max,scope=webhook-worker
            webhook-worker-1.cache-from=type=gha,scope=webhook-worker
            webhook-worker-2.cache-to=type=gha,mode=max,scope=webhook-worker
            webhook-worker-2.cache-from=type=gha,scope=webhook-worker
            audio-worker.cache-to=type=gha,mode=max,scope=audio-worker
            audio-worker.cache-from=type=gha,scope=audio-worker
            av-worker.cache-to=type=gha,mode=max,scope=av-worker
            av-worker.cache-from=type=gha,scope=av-worker
            ocr-worker.cache-to=type=gha,mode=max,scope=ocr-worker
            ocr-worker.cache-from=type=gha,scope=ocr-worker
            pandoc-worker.cache-to=type=gha,mode=max,scope=pandoc-worker
            pandoc-worker.cache-from=type=gha,scope=pandoc-worker

  # Tier 4: live E2E against the real compose stack (docker-compose.yml +
  # docker-compose.e2e.yml — the ONLY job referencing the .e2e.yml override,
  # confining its SSRF-guard relaxation to this test-only context).
  # ADVISORY on PR (continue-on-error true), REQUIRED on main-push (SC4).
  e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@v4
      # Reload images from the docker-build-tier-warmed GHA cache (near-instant:
      # same scopes as above).
      - uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            worker.cache-from=type=gha,scope=worker
            document-worker.cache-from=type=gha,scope=document-worker
            chromium-worker.cache-from=type=gha,scope=chromium-worker
            webhook-worker-1.cache-from=type=gha,scope=webhook-worker
            webhook-worker-2.cache-from=type=gha,scope=webhook-worker
            audio-worker.cache-from=type=gha,scope=audio-worker
            av-worker.cache-from=type=gha,scope=av-worker
            ocr-worker.cache-from=type=gha,scope=ocr-worker
            pandoc-worker.cache-from=type=gha,scope=pandoc-worker
      - name: Bring up compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
        # deliberately NOT --build here: images are already loaded and tagged
        # by bake above under the same {project}-{service} names compose
        # expects.
      - name: Wait for API readiness
        run: curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8090/healthz
      - name: Run migrations
        run: go run ./cmd/migrate
        env:
          DATABASE_URL: postgres://octo:octo-pass@localhost:5434/octo_db
      - name: Run E2E suite
        run: go test ./internal/e2e/... -timeout 30m
        env:
          E2E_BASE_URL: http://localhost:8090
          DATABASE_URL: postgres://octo:octo-pass@localhost:5434/octo_db
          API_KEY_SALT: dev-only-change-me-in-real-deploys
          WEBHOOK_SIGNING_SECRET: dev-only-change-me-in-real-deploys
          # presigned host minio:9000 isn't runner-resolvable from the host
          # process running `go test`; redirect the presigned-download dial
          # to the published MinIO port instead.
          E2E_S3_DIAL_ADDR: 127.0.0.1:9100
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
